<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass</title>
  <style>
    :root {
      --bg: #e7dece;
      --bg-accent: #d8ccb5;
      --surface: rgba(251, 247, 239, 0.94);
      --surface-strong: #f7f1e4;
      --surface-soft: #efe5d3;
      --text: #2f2a22;
      --muted: #6f6557;
      --line: rgba(74, 58, 36, 0.14);
      --line-strong: rgba(74, 58, 36, 0.24);
      --shadow: 0 26px 60px rgba(67, 52, 31, 0.10);
      --shadow-soft: 0 14px 34px rgba(67, 52, 31, 0.08);
      --primary: #55624a;
      --primary-strong: #384437;
      --primary-soft: rgba(85, 98, 74, 0.10);
      --success: #567056;
      --warning: #a0713f;
      --danger: #9a5f50;
      --accent-metal: #8f744c;
      --font-body: "Aptos", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-display: "Palatino Linotype", "Book Antiqua", "Iowan Old Style", Georgia, serif;
      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --max-width: 980px;
      --transition: 180ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(143, 116, 76, 0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(85, 98, 74, 0.10), transparent 24%),
        linear-gradient(180deg, #f1eadc 0%, var(--bg) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,252,246,0.38), transparent 24%),
        radial-gradient(circle at 20% 10%, rgba(255,248,234,0.32), transparent 18%),
        repeating-linear-gradient(90deg, rgba(111, 101, 87, 0.028) 0 1px, transparent 1px 24px);
      opacity: 0.9;
    }

    .app-shell {
      position: relative;
      width: min(calc(100% - 28px), var(--max-width));
      margin: 28px auto 48px;
      z-index: 1;
    }

    .hero {
      display: block;
      width: 100%;
      background:
        linear-gradient(180deg, rgba(255, 250, 242, 0.94), rgba(242, 234, 219, 0.94)),
        linear-gradient(90deg, rgba(143, 116, 76, 0.08), rgba(85, 98, 74, 0.05));
      border: 1px solid rgba(115, 91, 58, 0.18);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
      backdrop-filter: blur(10px);
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 12px;
      height: 10px;
      border-top: 1px solid rgba(143, 116, 76, 0.28);
      border-bottom: 1px solid rgba(143, 116, 76, 0.18);
      opacity: 0.9;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(85, 98, 74, 0.10);
      color: var(--primary-strong);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      border: 1px solid rgba(143, 116, 76, 0.18);
    }

    h1 {
      margin: 18px 0 10px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #2d241b;
    }

    .hero p {
      margin: 0;
      max-width: 60ch;
      color: var(--muted);
      line-height: 1.7;
    }

    .hero-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 0;
    }

    .pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(250, 245, 236, 0.92);
      border: 1px solid var(--line);
      font-size: 0.88rem;
      color: var(--text);
      box-shadow: 0 8px 18px rgba(67, 52, 31, 0.05);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 18px;
      padding: 7px;
      border-radius: 24px;
      background: rgba(245, 237, 224, 0.88);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(8px);
    }

    .tab-button {
      appearance: none;
      border: 0;
      border-radius: 16px;
      padding: 15px 16px;
      background: transparent;
      color: var(--muted);
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition), color var(--transition), transform var(--transition);
    }

    .tab-button.active {
      background: linear-gradient(135deg, #5c6a50, var(--primary-strong));
      color: #f8f1e4;
      box-shadow: 0 12px 26px rgba(56, 68, 55, 0.20);
    }

    .tab-button:active,
    .primary-button:active,
    .secondary-button:active,
    .nudge-button:active {
      transform: translateY(1px) scale(0.99);
    }

    .view {
      display: none;
      margin-top: 18px;
      animation: fadeIn 240ms ease;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(115, 91, 58, 0.14);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      padding: 22px;
      backdrop-filter: blur(10px);
    }

    .card.soft {
      background: rgba(248, 242, 232, 0.92);
    }

    .focus-card {
      position: relative;
      border-color: rgba(85, 98, 74, 0.20);
      background:
        linear-gradient(180deg, rgba(251, 246, 238, 0.96), rgba(241, 232, 215, 0.96));
    }

    .focus-card::before {
      content: "";
      display: block;
      width: 108px;
      height: 8px;
      margin-bottom: 10px;
      border-top: 1px solid rgba(143, 116, 76, 0.38);
      border-bottom: 1px solid rgba(143, 116, 76, 0.22);
    }

    .focus-card h3 {
      margin-top: 6px;
      margin-bottom: 8px;
      font-family: var(--font-display);
      font-size: 1.45rem;
      color: #30261d;
    }

    .focus-card .subtle {
      max-width: 70ch;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .card h2,
    .card h3,
    .card h4 {
      margin: 0;
      letter-spacing: -0.02em;
      font-family: var(--font-display);
      font-weight: 700;
    }

    .subtle {
      color: var(--muted);
      line-height: 1.55;
    }

    .day-banner {
      display: grid;
      gap: 14px;
    }

    .day-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(85, 98, 74, 0.08);
      color: var(--primary-strong);
      border: 1px solid rgba(85, 98, 74, 0.14);
    }

    .slot-grid {
      display: grid;
      gap: 14px;
    }

    .group-grid {
      display: grid;
      gap: 16px;
    }

    .exercise-group {
      display: grid;
      gap: 14px;
      padding: 16px;
      border: 1px solid rgba(115, 91, 58, 0.13);
      border-radius: 22px;
      background: rgba(249, 243, 233, 0.64);
    }

    .group-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .group-heading h4 {
      margin: 0;
      font-size: 1.08rem;
    }

    .group-slots {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .slot-card {
      background: linear-gradient(180deg, rgba(253,250,245,0.98), rgba(242,235,223,0.96));
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(67, 52, 31, 0.06);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    .slot-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(67, 52, 31, 0.09);
      border-color: rgba(85, 98, 74, 0.16);
    }

    .slot-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .slot-kicker {
      margin: 0 0 6px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .slot-title {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.25;
    }

    .slot-chip {
      flex-shrink: 0;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(242, 234, 220, 0.92);
      border: 1px solid var(--line);
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--primary-strong);
    }

    .exercise-name {
      margin: 3px 0 0;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
    }

    .nudge-line {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(85, 98, 74, 0.08);
      color: var(--primary-strong);
      font-size: 0.92rem;
    }

    .slot-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
    }

    .input-wrap {
      display: grid;
      gap: 8px;
    }

    .input-label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 1rem;
      color: var(--text);
      background: rgba(255, 251, 244, 0.96);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    input[type="text"]:focus {
      border-color: rgba(85, 98, 74, 0.42);
      box-shadow: 0 0 0 4px rgba(85, 98, 74, 0.08);
    }

    textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      padding: 14px 15px;
      font: inherit;
      color: var(--text);
      background: rgba(255, 251, 244, 0.96);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    textarea:focus {
      border-color: rgba(85, 98, 74, 0.42);
      box-shadow: 0 0 0 4px rgba(85, 98, 74, 0.08);
    }

    .nudge-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nudge-button,
    .primary-button,
    .secondary-button,
    .ghost-button {
      appearance: none;
      border: 0;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition), border-color var(--transition);
    }

    .nudge-button {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 250, 243, 0.98);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(67, 52, 31, 0.05);
    }

    .nudge-button.active-up {
      background: rgba(63, 143, 101, 0.14);
      border-color: rgba(63, 143, 101, 0.35);
      color: var(--success);
    }

    .nudge-button.active-down {
      background: rgba(184, 92, 92, 0.14);
      border-color: rgba(184, 92, 92, 0.32);
      color: var(--danger);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .primary-button,
    .secondary-button,
    .ghost-button {
      min-height: 52px;
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
    }

    .primary-button:disabled,
    .secondary-button:disabled,
    .ghost-button:disabled {
      cursor: not-allowed;
      opacity: 0.52;
      transform: none;
      box-shadow: none;
    }

    .primary-button {
      background: linear-gradient(135deg, #607055, var(--primary-strong));
      color: #f7f1e4;
      box-shadow: 0 16px 24px rgba(56, 68, 55, 0.18);
    }

    .secondary-button {
      background: rgba(250, 245, 236, 0.96);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: 0 10px 18px rgba(67, 52, 31, 0.05);
    }

    .ghost-button {
      background: rgba(173, 90, 90, 0.10);
      color: var(--danger);
      border: 1px solid rgba(173, 90, 90, 0.16);
    }

    .today-empty {
      text-align: center;
      padding: 28px 20px;
    }

    .action-card {
      display: grid;
      gap: 14px;
      text-align: left;
    }

    .action-value {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(253,249,243,0.98), rgba(241,234,222,0.96));
      border: 1px solid var(--line);
    }

    .switch {
      position: relative;
      width: 62px;
      height: 36px;
      flex-shrink: 0;
    }

    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(24, 39, 34, 0.16);
      border-radius: 999px;
      transition: background var(--transition);
    }

    .slider::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 8px 16px rgba(20, 38, 32, 0.18);
      transition: transform var(--transition);
    }

    .switch input:checked + .slider {
      background: linear-gradient(135deg, #607055, var(--primary-strong));
    }

    .switch input:checked + .slider::before {
      transform: translateX(26px);
    }

    .stats-grid,
    .library-grid,
    .history-grid {
      display: grid;
      gap: 14px;
    }

    .stats-grid {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    }

    .library-grid {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .stat-card,
    .mini-card {
      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(253,249,243,0.98), rgba(241,234,222,0.96));
      border: 1px solid var(--line);
      box-shadow: 0 10px 22px rgba(67, 52, 31, 0.05);
    }

    .stat-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.86rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 800;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .mini-card h4 {
      margin-bottom: 8px;
      font-size: 1.02rem;
    }

    .inline-list,
    .detail-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .inline-list li,
    .detail-list li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(24, 49, 42, 0.08);
      color: var(--muted);
    }

    .inline-list li:last-child,
    .detail-list li:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .detail-list strong {
      color: var(--text);
    }

    .history-item {
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(247,249,248,0.94));
      border: 1px solid var(--line);
    }

    .history-item h4 {
      margin-bottom: 8px;
    }

    .history-meta {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 10px;
    }

    .muted-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .accordion {
      overflow: hidden;
    }

    .accordion summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 800;
      font-size: 1rem;
    }

    .accordion summary::-webkit-details-marker {
      display: none;
    }

    .accordion summary::after {
      content: "+";
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(64, 107, 90, 0.10);
      color: var(--primary-strong);
      font-size: 1.15rem;
      flex-shrink: 0;
      transition: transform var(--transition), background var(--transition);
    }

    .accordion[open] summary::after {
      transform: rotate(45deg);
      background: rgba(64, 107, 90, 0.16);
    }

    .accordion-body {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(24, 49, 42, 0.08);
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .timer-row.centered {
      justify-content: center;
      text-align: center;
    }

    .timer-row.centered .button-row,
    .timer-row.centered .timer-options {
      justify-content: center;
    }

    .timer-display {
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .timer-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .hiit-panel {
      display: grid;
      gap: 16px;
    }

    .hiit-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(120px, 160px) auto;
      gap: 14px;
      align-items: end;
    }

    .set-counter {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #ffffff;
      font-weight: 800;
      color: var(--primary-strong);
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 50;
    }

    .confetti-piece {
      position: absolute;
      top: -12vh;
      width: 12px;
      height: 18px;
      border-radius: 4px;
      opacity: 0.96;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translate3d(0, -10vh, 0) rotate(0deg);
      }
      100% {
        transform: translate3d(var(--drift), 110vh, 0) rotate(var(--spin));
        opacity: 0.9;
      }
    }

    @media (max-width: 720px) {
      .app-shell {
        width: min(calc(100% - 12px), var(--max-width));
        margin: 10px auto 28px;
      }

      .hero,
      .card {
        border-radius: 20px;
        padding: 14px;
      }

      .hero {
        display: block;
        width: 100%;
        padding: 10px 12px;
      }

      .tabs {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
        margin-top: 12px;
        padding: 5px;
        border-radius: 18px;
      }

      .tab-button {
        min-height: 42px;
        padding: 10px 8px;
        border-radius: 12px;
        font-size: 0.83rem;
      }

      .slot-controls {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .stack {
        gap: 12px;
      }

      .view {
        margin-top: 12px;
      }

      .hero-meta {
        gap: 6px;
      }

      .pill {
        padding: 7px 10px;
        font-size: 0.8rem;
      }

      .card-header {
        margin-bottom: 12px;
      }

      .subtle {
        line-height: 1.45;
      }

      .slot-grid {
        gap: 10px;
      }

      .group-slots,
      .hiit-controls {
        grid-template-columns: 1fr;
      }

      .slot-card {
        border-radius: 18px;
        padding: 14px;
      }

      .slot-top {
        gap: 8px;
        margin-bottom: 10px;
      }

      .slot-kicker {
        margin-bottom: 4px;
        font-size: 0.72rem;
      }

      .slot-title {
        font-size: 1rem;
      }

      .exercise-name {
        font-size: 0.96rem;
      }

      .slot-chip {
        padding: 6px 9px;
        border-radius: 11px;
        font-size: 0.8rem;
      }

      .nudge-line {
        margin-top: 8px;
        padding: 8px 10px;
        border-radius: 12px;
        font-size: 0.85rem;
      }

      .input-wrap {
        gap: 6px;
      }

    function shuffle(array) {
      const copy = Array.isArray(array) ? array.slice() : [];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;
    }

    function getTodayKey() {

      return year + "-" + month + "-" + day;

    function isValidFocusLesson(value) {
      return !!value
        && typeof value.title === "string"
        && value.title.trim()
        && typeof value.text === "string"

    }

    function loadFocusBag() {
      try {
        const raw = localStorage.getItem(LS_FOCUS_BAG_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            const validLessons = parsed.filter(isValidFocusLesson);
            if (validLessons.length) {
              return validLessons;
            }
          }
        }
      } catch (error) {
        console.warn("Kon focus-bag niet laden, nieuwe bag wordt gemaakt.", error);
      }

      const freshBag = shuffle(STOIC_FOCUS_LESSONS);
      localStorage.setItem(LS_FOCUS_BAG_KEY, JSON.stringify(freshBag));
      return freshBag;
    }

    function drawFocus() {
      let bag = loadFocusBag();
      let previousFocus = null;

      try {
        const raw = localStorage.getItem(LS_FOCUS_TODAY_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (isValidFocusLesson(parsed)) {
            previousFocus = parsed;
          }
        }
      } catch (error) {
        console.warn("Kon vorige focus niet lezen.", error);
      }

      if (!bag.length) {
        bag = shuffle(STOIC_FOCUS_LESSONS);
      }

      if (
        previousFocus
        && bag.length > 1
        && bag[0]
        && bag[0].title === previousFocus.title
        && bag[0].text === previousFocus.text
      ) {
        const swapIndex = bag.findIndex((lesson) => lesson.title !== previousFocus.title || lesson.text !== previousFocus.text);
        if (swapIndex > 0) {
          [bag[0], bag[swapIndex]] = [bag[swapIndex], bag[0]];
        }
      }

      const focus = bag.shift() || STOIC_FOCUS_LESSONS[0];

      if (!bag.length) {
        bag = shuffle(STOIC_FOCUS_LESSONS);
        if (
          bag.length > 1
          && bag[0]
          && bag[0].title === focus.title
          && bag[0].text === focus.text
        ) {
          const swapIndex = bag.findIndex((lesson) => lesson.title !== focus.title || lesson.text !== focus.text);
          if (swapIndex > 0) {
            [bag[0], bag[swapIndex]] = [bag[swapIndex], bag[0]];
          }
        }
      }

      localStorage.setItem(LS_FOCUS_BAG_KEY, JSON.stringify(bag));
      return focus;
    }

      const cachedDay = localStorage.getItem(LS_FOCUS_DAY_KEY);

      if (cachedDay === today) {

          const raw = localStorage.getItem(LS_FOCUS_TODAY_KEY);

            const parsed = JSON.parse(raw);

        } catch (error) {
          console.warn("Kon focus van vandaag niet laden.", error);

      const focus = drawFocus();
      localStorage.setItem(LS_FOCUS_DAY_KEY, today);
      localStorage.setItem(LS_FOCUS_TODAY_KEY, JSON.stringify(focus));
      return focus;
    }

    function getSlotPrescription(slot) {
      if (slot.patternKey === "core") {
        return "2-3 sets van 10 reps";
      }
      if (slot.patternKey === "secondary") {
        return "2-3 sets van 12 reps";
      }
      return "";
    }

    function resetCurrentWorkoutWithLatestExercises() {
      if (!state.currentWorkout || state.currentWorkout.day !== state.currentDay || !isTrainingDay(state.currentDay)) {
        return false;
      }

      if (state.currentWorkout.rotationSnapshot) {
        state.rotations = cloneRotations(state.currentWorkout.rotationSnapshot);
      }

      state.currentWorkout = null;
      saveState();
      return true;
    }

    function dayLabel(day) {
      return "Dag " + day;
    }

    function getDayConfig(day) {
      if (day === 6 && !state.settings.hiitAsDay) {
        return {
          type: "recovery",
          title: "Rust / Active Mobility",
          subtitle: "HIIT zit als korte finisher na trainingsdagen."
        };
      }
      return DAY_CYCLE[day] || DAY_CYCLE[1];
    }

    function isTrainingDay(day) {
      return TRAINING_DAYS.includes(day);
    }

    function getSubcategoryKey(patternKey, subcategory) {
      return patternKey + "::" + subcategory;
    }

    function getStandardExerciseOptions(patternKey, subcategory) {
      if (patternKey === "secondary") {
        return PROGRAM.secondary.exercises.slice();
      }
      return (PROGRAM[patternKey].exercises[subcategory] || []).slice();
    }

    function getCustomExerciseOptions(patternKey, subcategory) {
      if (patternKey === "secondary") {
        return Array.isArray(state.customExercises.secondary) ? state.customExercises.secondary : [];
      }
      const group = state.customExercises[patternKey] || {};
      return Array.isArray(group[subcategory]) ? group[subcategory] : [];
    }

    function getExerciseOptions(patternKey, subcategory) {
      const custom = getCustomExerciseOptions(patternKey, subcategory).filter(Boolean);
      if (custom.length) {
        return custom;
      }
      return getStandardExerciseOptions(patternKey, subcategory);
    }

    function getNextSubcategory(patternKey) {
      const pattern = PROGRAM[patternKey];
      const list = pattern.subcategories;
      const currentIndex = state.rotations.subcategories[patternKey] || 0;
      const subcategory = list[currentIndex % list.length];
      state.rotations.subcategories[patternKey] = currentIndex + 1;
      return subcategory;
    }

    function getNextExercise(patternKey, subcategory) {
      const options = getExerciseOptions(patternKey, subcategory);
      const key = getSubcategoryKey(patternKey, subcategory);
      const currentIndex = state.rotations.exercises[key] || 0;
      const exercise = options[currentIndex % options.length];
      state.rotations.exercises[key] = currentIndex + 1;
      return exercise;
    }

    function getNextSecondaryExercise() {
      const options = getExerciseOptions("secondary", "Secundair");
      const currentIndex = state.rotations.subcategories.secondary || 0;
      const exercise = options[currentIndex % options.length];
      state.rotations.subcategories.secondary = currentIndex + 1;
      return exercise;
    }

    function getExerciseRecord(exercise) {
      if (!state.records.exercises[exercise]) {
        state.records.exercises[exercise] = {
          lastValue: "",
          pendingNudge: null
        };
      }
      return state.records.exercises[exercise];
    }

    function buildPreviousText(lastValue, pendingNudge) {
      if (!lastValue) {
        return "";
      }
      if (pendingNudge === "up") {
        return "Vorige keer: " + lastValue + " — probeer iets zwaarder";
      }
      if (pendingNudge === "down") {
        return "Vorige keer: " + lastValue + " — probeer iets lichter";
      }
      return "Vorige keer: " + lastValue;
    }

    function createAutoSlot(id, slotType, patternKey, titleOverride) {
      const pattern = PROGRAM[patternKey];
      const subcategory = getNextSubcategory(patternKey);
      const exercise = getNextExercise(patternKey, subcategory);
      const record = getExerciseRecord(exercise);
      const previousText = buildPreviousText(record.lastValue, record.pendingNudge);
      const inputValue = record.lastValue || "";
      const slot = {
        id,
        slotType,
        patternKey,
        label: titleOverride || pattern.label,
        subcategory,
        exercise,
        previousText,
        inputValue,
        nudgeChoice: null
      };
      record.pendingNudge = null;
      return slot;
    }

    function createFreeChoiceSlot(id, slotType, patternKey, titleOverride) {
      const pattern = PROGRAM[patternKey];
      const subcategory = patternKey === "secondary" ? "Secundair" : getNextSubcategory(patternKey);
      return {
        id,
        slotType,
        patternKey,
        label: titleOverride || pattern.label,
        subcategory,
        exercise: null,
        previousText: "",
        inputValue: "",
        nudgeChoice: null
      };
    }

    function createSecondarySlot(id, freeChoiceMode) {
      if (freeChoiceMode) {
        return createFreeChoiceSlot(id, "secondary", "secondary", "Secundair");
      }
      const exercise = getNextSecondaryExercise();
      const record = getExerciseRecord(exercise);
      const slot = {
        id,
        slotType: "secondary",
        patternKey: "secondary",
        label: "Secundair",
        subcategory: "Secundair",
        exercise,
        previousText: buildPreviousText(record.lastValue, record.pendingNudge),
        inputValue: record.lastValue || "",
        nudgeChoice: null
      };
      record.pendingNudge = null;
      return slot;
    }

    function rotateMainOrder() {
      const order = MAIN_ORDERS[state.rotations.mainOrderIndex % MAIN_ORDERS.length];
      state.rotations.mainOrderIndex += 1;
      return order;
    }

    function ensureCurrentWorkout() {
      if (!isTrainingDay(state.currentDay)) {
        state.currentWorkout = null;
        return;
      }

      if (state.currentWorkout && state.currentWorkout.day === state.currentDay) {
        return;
      }

      const freeChoiceMode = !!state.settings.freeChoice;
      const rotationSnapshot = cloneRotations(state.rotations);
      const mainOrder = rotateMainOrder();
      const slots = [];

      if (freeChoiceMode) {
        slots.push(createFreeChoiceSlot("core", "core", "core", "Core"));
      } else {
        slots.push(createAutoSlot("core", "core", "core", "Core"));
      }

      mainOrder.forEach((patternKey, index) => {
        const slotId = "main-" + index;
        if (freeChoiceMode) {
          slots.push(createFreeChoiceSlot(slotId, "main", patternKey));
        } else {
          slots.push(createAutoSlot(slotId, "main", patternKey));
        }
      });

      slots.push(createSecondarySlot("secondary", freeChoiceMode));

      state.currentWorkout = {
        id: "workout-" + Date.now(),
        day: state.currentDay,
        generatedAt: new Date().toISOString(),
        freeChoiceMode,
        rotationSnapshot,
        order: mainOrder,
        slots
      };
      saveState();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderFocusOfTheDay() {
      const focus = getTodayFocus();
      return `
        <article class="card soft focus-card">
          <p class="slot-kicker">Focus of the Day</p>
          <h3>${escapeHtml(focus.title)}</h3>
          <p class="subtle">${escapeHtml(focus.text)}</p>
        </article>
      `;
    }

    function formatDateTime(value) {
      try {
        return new Date(value).toLocaleString("nl-NL", {
          dateStyle: "medium",
          timeStyle: "short"
        });
      } catch (error) {
        return value;
      }
    }

    function nextDayValue(day) {
      return day === 7 ? 1 : day + 1;
    }

    function getCurrentHiitOption() {
      return formatHiitPlan(getCurrentHiitPlan(false));
    }

    function getCurrentEmbeddedHiitOption() {
      return formatHiitPlan(getCurrentHiitPlan(true));
    }

    function getCurrentHiitPlan(halved) {
      const currentIndex = state.rotations.subcategories.hiit || 0;
      const plan = HIIT_PLANS[currentIndex % HIIT_PLANS.length];
      return {
        ...plan,
        optionIndex: currentIndex % HIIT_PLANS.length,
        mode: halved ? "half" : "full",
        targetSets: halved ? plan.halfSets : plan.fullSets
      };
    }

    function formatHiitPlan(plan) {
      return plan.name + ": " + plan.targetSets + " x " + plan.workSec + " sec hard / " + getHiitRestSeconds(plan) + " sec rust.";
    }

    function getHiitRestSeconds(plan) {
      const savedRest = Number(state.hiit.restDurations[getHiitSessionKey(plan)]);
      return savedRest > 0 ? savedRest : plan.restSec;
    }

    function advanceHiitRotation() {
      state.rotations.subcategories.hiit = (state.rotations.subcategories.hiit || 0) + 1;
    }

    function formatSeconds(totalSeconds) {
      const safeSeconds = Math.max(0, totalSeconds);
      const minutes = Math.floor(safeSeconds / 60);
      const seconds = safeSeconds % 60;
      return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
    }

    function getRestTimerKeys() {
      return Object.keys(state.timers || {});
    }

    function getTimerState(timerKey) {
      return state.timers[timerKey];
    }

    function getRemainingSeconds(timerKey) {
      const timer = getTimerState(timerKey);
      if (!timer.running || !timer.endTime) {
        return timer.lastDurationSec || (timerKey === "short" ? 60 : 180);
      }
      const diffMs = timer.endTime - Date.now();
      return Math.max(0, Math.ceil(diffMs / 1000));
    }

    function syncTimerState() {
      getRestTimerKeys().forEach((timerKey) => {
        const timer = getTimerState(timerKey);
        if (!timer.running || !timer.endTime) {
          return;
        }
        if (Date.now() >= timer.endTime && !timer.beeped) {
          timer.beeped = true;
          timer.running = false;
          saveState();
          playBeep(1046);
        }
      });
      syncHiitTimerState();
      updateWakeLock();
    }

    function startRestTimer(timerKey, durationSec) {
      const timer = getTimerState(timerKey);
      timer.lastDurationSec = durationSec;
      timer.endTime = Date.now() + (durationSec * 1000);
      timer.running = true;
      timer.beeped = false;
      saveState();
      startTimerLoop();
      updateWakeLock();
      renderApp();
    }

    function stopRestTimer(timerKey) {
      const timer = getTimerState(timerKey);
      timer.running = false;
      timer.endTime = null;
      timer.beeped = false;
      saveState();
      updateWakeLock();
      renderApp();
    }

    function startTimerLoop() {
      if (timerIntervalId) {
        return;
      }
      timerIntervalId = window.setInterval(() => {
        syncTimerState();
        updateTimerDisplay();
      }, 250);
    }

    function updateTimerDisplay() {
      getRestTimerKeys().forEach((timerKey) => {
        const display = document.getElementById("timerDisplay-" + timerKey);
        if (display) {
          display.textContent = formatSeconds(getRemainingSeconds(timerKey));
        }
      });
      const hiitDisplay = document.getElementById("hiitTimerDisplay");
      if (hiitDisplay) {
        hiitDisplay.textContent = formatSeconds(getHiitRemainingSeconds());
      }
      const anyRunning = getRestTimerKeys().some((timerKey) => getTimerState(timerKey).running) || state.hiit.timer.running;
      if (!anyRunning && timerIntervalId) {
        window.clearInterval(timerIntervalId);
        timerIntervalId = null;
      }
      updateWakeLock();
    }

    function playBeep(frequency) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return;
        }
        const context = new AudioContextClass();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = frequency || 880;
        gain.gain.setValueAtTime(0.001, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.18, context.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.55);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.55);
      } catch (error) {
        console.warn("Beep kon niet worden afgespeeld.", error);
      }
    }

    function getHiitSessionKey(plan) {
      return plan.mode + "-" + plan.optionIndex;
    }

    function prepareHiitSession(plan) {
      const changedPlan = state.hiit.activeOptionIndex !== plan.optionIndex || state.hiit.activeMode !== plan.mode;
      if (changedPlan) {
        state.hiit.activeOptionIndex = plan.optionIndex;
        state.hiit.activeMode = plan.mode;
        state.hiit.setsDone = 0;
        state.hiit.timer.running = false;
        state.hiit.timer.endTime = null;
        state.hiit.timer.phase = "idle";
        state.hiit.timer.beeped = false;
        saveState();
      }
    }

    function getHiitRemainingSeconds() {
      const timer = state.hiit.timer;
      if (!timer.running || !timer.endTime) {
        const plan = getCurrentHiitPlan(state.hiit.activeMode === "half");
        return timer.phase === "rest" ? getHiitRestSeconds(plan) : plan.workSec;
      }
      return Math.max(0, Math.ceil((timer.endTime - Date.now()) / 1000));
    }

    function syncHiitTimerState() {
      const timer = state.hiit.timer;
      if (!timer.running || !timer.endTime || Date.now() < timer.endTime || timer.beeped) {
        return;
      }

      const plan = getCurrentHiitPlan(state.hiit.activeMode === "half");
      timer.beeped = true;
      playBeep(timer.phase === "work" ? 1175 : 880);

      if (timer.phase === "work") {
        state.hiit.setsDone = Math.min(plan.targetSets, (state.hiit.setsDone || 0) + 1);
        timer.phase = state.hiit.setsDone >= plan.targetSets ? "done" : "rest";
        timer.running = false;
        timer.endTime = null;
      } else {
        timer.phase = "idle";
        timer.running = false;
        timer.endTime = null;
      }
      saveState();
      renderApp();
    }

    function startHiitPhase(phase) {
      const plan = getCurrentHiitPlan(state.hiit.activeMode === "half");
      if (state.hiit.setsDone >= plan.targetSets && phase === "work") {
        state.hiit.setsDone = 0;
      }
      state.hiit.timer.phase = phase;
      state.hiit.timer.endTime = Date.now() + ((phase === "rest" ? getHiitRestSeconds(plan) : plan.workSec) * 1000);
      state.hiit.timer.running = true;
      state.hiit.timer.beeped = false;
      saveState();
      startTimerLoop();
      updateWakeLock();
      renderApp();
    }

    function stopHiitTimer() {
      state.hiit.timer.running = false;
      state.hiit.timer.endTime = null;
      state.hiit.timer.beeped = false;
      saveState();
      updateWakeLock();
      renderApp();
    }

    function resetHiitSets() {
      state.hiit.setsDone = 0;
      state.hiit.timer.running = false;
      state.hiit.timer.endTime = null;
      state.hiit.timer.phase = "idle";
      state.hiit.timer.beeped = false;
      saveState();
      updateWakeLock();
      renderApp();
    }

    function updateHiitWeight(value) {
      const plan = getCurrentHiitPlan(state.hiit.activeMode === "half");
      state.hiit.weights[getHiitSessionKey(plan)] = value;
      saveState();
    }

    function updateHiitRestDuration(value) {
      const plan = getCurrentHiitPlan(state.hiit.activeMode === "half");
      const restSeconds = Math.max(15, Math.min(240, Number(value) || plan.restSec));
      state.hiit.restDurations[getHiitSessionKey(plan)] = restSeconds;
      if (!state.hiit.timer.running && state.hiit.timer.phase === "rest") {
        state.hiit.timer.endTime = null;
      }
      saveState();
      renderApp();
    }

    function anyTimerRunning() {
      return getRestTimerKeys().some((timerKey) => getTimerState(timerKey).running) || state.hiit.timer.running;
    }

    async function requestWakeLock() {
      if (wakeLock || !("wakeLock" in navigator) || document.visibilityState !== "visible") {
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => {
          wakeLock = null;
        });
      } catch (error) {
        wakeLock = null;
      }
    }

    async function releaseWakeLock() {
      if (!wakeLock) {
        return;
      }
      try {
        await wakeLock.release();
      } catch (error) {
        wakeLock = null;
      }
    }

    function updateWakeLock() {
      if (anyTimerRunning()) {
        requestWakeLock();
      } else {
        releaseWakeLock();
      }
    }

    function renderToday() {
      ensureCurrentWorkout();
      const view = document.getElementById("todayView");
      const day = state.currentDay;
      const config = getDayConfig(day);

      /*
        <article class="card day-banner">
          <div class="card-header">
            <div>
              <h2>${escapeHtml(dayLabel(day))} · ${escapeHtml(config.title)}</h2>
              <p class="subtle">${escapeHtml(config.subtitle)}</p>
            </div>
            <div class="slot-chip">${isTrainingDay(day) ? "Trainen" : "Herstel"}</div>
          </div>
          <div class="day-badges">
            <div class="badge">Volgende dag: ${escapeHtml(dayLabel(nextDayValue(day)))}</div>
            <div class="badge">Vrije keus: ${state.settings.freeChoice ? "aan" : "uit"}</div>
            <div class="badge">Trainingen afgerond: ${state.trainingSessionsCompleted}</div>
          </div>
        </article>
      */

      if (!isTrainingDay(day)) {
        let valueLine = config.title;
        if (day === 2) {
          valueLine = "Zone 2 cardio - 30 tot 45 minuten";
        } else if (day === 6 && state.settings.hiitAsDay) {
          valueLine = getCurrentHiitOption();
        } else {
          valueLine = "Rust / Active Mobility";
        }
        const hiitDayHtml = day === 6 && state.settings.hiitAsDay ? renderHiitCard(false) : "";

        view.innerHTML = `
          <div class="stack">
            ${renderFocusOfTheDay()}
            <article class="card action-card">
              <div class="card-header">
                <div>
                  <h3>${escapeHtml(config.title)}</h3>
                  <p class="subtle">${escapeHtml(config.subtitle)}</p>
                </div>
              </div>
              <div class="action-value">${escapeHtml(valueLine)}</div>
              ${hiitDayHtml}
              ${renderRecoveryGuidance(day)}
              <p class="subtle">Rond deze dag af met Dag afronden, of sla hem stil over zonder confetti. Daarna ga je door naar de volgende dag in de 7-daagse cyclus.</p>
              <div class="button-row">
                <button class="primary-button" type="button" id="finishRecoveryButton">Dag afronden</button>
                <button class="secondary-button" type="button" id="skipDayButton">Sla over</button>
              </div>
            </article>
          </div>
        `;
        bindWorkoutControls();
        document.getElementById("finishRecoveryButton").addEventListener("click", handleFinishRecoveryDay);
        document.getElementById("skipDayButton").addEventListener("click", handleSkipDay);
        return;
      }

      const workout = state.currentWorkout;
      const groupsHtml = renderTrainingGroups(workout);
      const guidanceHtml = renderGuidanceAccordion();
      const warmupHtml = renderWarmupAccordion();
      const cooldownHtml = renderCooldownAccordion();
      const hiitFinisherHtml = state.settings.hiitAsDay ? "" : renderEmbeddedHiitCard();
      const modeNote = workout.freeChoiceMode
        ? `<p class="muted-note">Vrije keus staat aan voor deze sessie: je ziet per slot alleen patroon en subcategorie, zonder gewichtsveld of nudge-knoppen.</p>`
        : "";

      view.innerHTML = `
        <div class="stack">
          ${renderFocusOfTheDay()}
          ${guidanceHtml}
          ${warmupHtml}
          <article class="card">
            <div class="card-header">
              <div>
                <h3>Vandaag</h3>
              </div>
              <div class="slot-chip">Sessie ${state.trainingSessionsCompleted + 1}</div>
            </div>
            ${groupsHtml}
            ${hiitFinisherHtml}
            ${modeNote}
            ${cooldownHtml}
            <div class="button-row">
              <button class="primary-button" type="button" id="finishWorkoutButton">Dag afronden</button>
            </div>
          </article>
        </div>
      `;

      bindWorkoutControls();
    }

    function renderTrainingGroups(workout) {
      const coreSlot = workout.slots.find((slot) => slot.slotType === "core");
      const mainSlots = workout.slots.filter((slot) => slot.slotType === "main");
      const secondarySlot = workout.slots.find((slot) => slot.slotType === "secondary");
      const groups = [
        { id: "groupA", title: "Groepering A", subtitle: "Eerste twee hoofdpatronen", slots: mainSlots.slice(0, 2) },
        { id: "groupB", title: "Groepering B", subtitle: "Laatste twee hoofdpatronen", slots: mainSlots.slice(2, 4) },
        { id: "groupC", title: "Groepering C", subtitle: "Core en secundair", slots: [coreSlot, secondarySlot].filter(Boolean) }
      ];

      return `
        <div class="group-grid">
          ${groups.map((group) => renderExerciseGroup(group, workout.freeChoiceMode)).join("")}
        </div>
      `;
    }

    function renderExerciseGroup(group, freeChoiceMode) {
      return `
        <section class="exercise-group">
          <div class="group-heading">
            <div>
              <h4>${escapeHtml(group.title)}</h4>
              <p class="subtle">${escapeHtml(group.subtitle)}</p>
            </div>
            <div class="slot-chip">${group.slots.length} oefeningen</div>
          </div>
          <div class="group-slots">
            ${group.slots.map((slot) => renderSlot(slot, freeChoiceMode)).join("")}
          </div>
          ${renderGroupTimer(group.id)}
        </section>
      `;
    }

    function renderGroupTimer(timerKey) {
      const timer = getTimerState(timerKey);
      return `
        <div class="mini-card">
          <div class="timer-row centered">
            <div>
              <div class="slot-kicker">Rust tussen deze oefeningen</div>
              <div class="timer-display" id="timerDisplay-${escapeHtml(timerKey)}">${formatSeconds(getRemainingSeconds(timerKey))}</div>
            </div>
          </div>
          <div class="timer-options">
            ${GROUP_REST_OPTIONS.map((seconds) => `
              <button class="primary-button" type="button" data-action="group-timer-start" data-timer-key="${escapeHtml(timerKey)}" data-duration="${seconds}">
                ${timer.running && timer.lastDurationSec === seconds ? "Herstart" : "Start"} ${formatSeconds(seconds)}
              </button>
            `).join("")}
            <button class="secondary-button" type="button" data-action="group-timer-stop" data-timer-key="${escapeHtml(timerKey)}">Stop</button>
          </div>
        </div>
      `;
    }

    function renderSlot(slot, freeChoiceMode) {
      const nudgeMarkup = !freeChoiceMode && slot.previousText
        ? `<div class="nudge-line">${escapeHtml(slot.previousText)}</div>`
        : "";
      const prescription = getSlotPrescription(slot);
      const exerciseMarkup = freeChoiceMode
        ? ""
        : `<p class="exercise-name">${escapeHtml(slot.exercise)}</p>`;
      const prescriptionMarkup = prescription
        ? `<div class="nudge-line">${escapeHtml(prescription)}</div>`
        : "";
      const controlsMarkup = freeChoiceMode
        ? ""
        : `
          <div class="slot-controls">
            <label class="input-wrap">
              <span class="input-label">Gewicht / notitie</span>
              <input
                type="text"
                value="${escapeHtml(slot.inputValue || "")}"
                placeholder="Bijv. 24 kg of 2x8"
                data-action="slot-input"
                data-slot-id="${escapeHtml(slot.id)}"
              >
            </label>
            <div class="nudge-controls">
              <button class="nudge-button ${slot.nudgeChoice === "down" ? "active-down" : ""}" type="button" data-action="nudge" data-slot-id="${escapeHtml(slot.id)}" data-direction="down" aria-label="Volgende keer iets lichter">-</button>
              <button class="nudge-button ${slot.nudgeChoice === "up" ? "active-up" : ""}" type="button" data-action="nudge" data-slot-id="${escapeHtml(slot.id)}" data-direction="up" aria-label="Volgende keer iets zwaarder">+</button>
            </div>
          </div>
        `;

      return `
        <article class="slot-card">
          <div class="slot-top">
            <div>
              <p class="slot-kicker">${escapeHtml(slot.label)}</p>
              <h4 class="slot-title">${escapeHtml(slot.subcategory)}</h4>
              ${exerciseMarkup}

    function bindWorkoutControls() {
      bindTimerControls();

      document.querySelectorAll('[data-action="slot-input"]').forEach((input) => {
        input.addEventListener("input", (event) => {
          const slotId = event.target.getAttribute("data-slot-id");
          const slot = findWorkoutSlot(slotId);
          if (!slot) {
            return;
          }
          slot.inputValue = event.target.value;
          saveState();
        });
      });

      document.querySelectorAll('[data-action="nudge"]').forEach((button) => {
        button.addEventListener("click", () => {
          const slotId = button.getAttribute("data-slot-id");
          const direction = button.getAttribute("data-direction");
          const slot = findWorkoutSlot(slotId);
          if (!slot) {
            return;
          }
          slot.nudgeChoice = slot.nudgeChoice === direction ? null : direction;
          saveState();
          renderToday();
        });
      });

      const finishButton = document.getElementById("finishWorkoutButton");
      if (finishButton) {
        finishButton.addEventListener("click", handleFinishWorkout);
      }
    }

    function bindTimerControls() {
      document.querySelectorAll('[data-action="group-timer-start"]').forEach((button) => {
        button.addEventListener("click", () => {
          startRestTimer(button.getAttribute("data-timer-key"), Number(button.getAttribute("data-duration")));
        });
      });

      document.querySelectorAll('[data-action="group-timer-stop"]').forEach((button) => {
        button.addEventListener("click", () => stopRestTimer(button.getAttribute("data-timer-key")));
      });

      const hiitWeightInput = document.querySelector('[data-action="hiit-weight"]');
      if (hiitWeightInput) {
        hiitWeightInput.addEventListener("input", (event) => updateHiitWeight(event.target.value));
      }

      const hiitRestDurationInput = document.querySelector('[data-action="hiit-rest-duration"]');
      if (hiitRestDurationInput) {
        hiitRestDurationInput.addEventListener("change", (event) => updateHiitRestDuration(event.target.value));
      }

      const hiitStartButton = document.querySelector('[data-action="hiit-start"]');
      if (hiitStartButton) {
        hiitStartButton.addEventListener("click", () => startHiitPhase("work"));
      }

      const hiitRestButton = document.querySelector('[data-action="hiit-rest"]');
      if (hiitRestButton) {
        hiitRestButton.addEventListener("click", () => startHiitPhase("rest"));
      }

      const hiitStopButton = document.querySelector('[data-action="hiit-stop"]');
      if (hiitStopButton) {
        hiitStopButton.addEventListener("click", stopHiitTimer);
      }

      const hiitResetButton = document.querySelector('[data-action="hiit-reset"]');
      if (hiitResetButton) {
        hiitResetButton.addEventListener("click", resetHiitSets);
      }
    }

    function findWorkoutSlot(slotId) {
      if (!state.currentWorkout) {
        return null;
      }
      return state.currentWorkout.slots.find((slot) => slot.id === slotId) || null;
    }

    function handleFinishWorkout() {
      if (!state.currentWorkout) {
        return;
      }

      const workout = state.currentWorkout;
      workout.slots.forEach((slot) => {
        if (!workout.freeChoiceMode && slot.exercise) {
          const record = getExerciseRecord(slot.exercise);
          if (slot.inputValue && slot.inputValue.trim()) {
            record.lastValue = slot.inputValue.trim();
          }
          record.pendingNudge = slot.nudgeChoice || null;
        }
      });

      state.history.unshift({
        id: "history-" + Date.now(),
        type: "training",
        day: state.currentDay,
        title: "Training afgerond",
        completedAt: new Date().toISOString(),
        freeChoiceMode: workout.freeChoiceMode,
        hiitFinisher: state.settings.hiitAsDay ? null : getCurrentEmbeddedHiitOption(),
        hiitWeight: state.settings.hiitAsDay ? "" : (state.hiit.weights[getHiitSessionKey(getCurrentHiitPlan(true))] || ""),
        hiitSetsDone: state.settings.hiitAsDay ? 0 : (state.hiit.setsDone || 0),
        slots: workout.slots.map((slot) => ({
          label: slot.label,
          subcategory: slot.subcategory,
          exercise: slot.exercise,
          value: slot.inputValue || ""
        }))
      });

      if (!state.settings.hiitAsDay) {
        advanceHiitRotation();
      }
      state.trainingSessionsCompleted += 1;
      state.totalDayAdvances += 1;
      state.currentDay = nextDayValue(state.currentDay);
      state.currentWorkout = null;
      saveState();
      launchConfetti();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function handleSkipDay() {
      const config = getDayConfig(state.currentDay);
      if (state.currentDay === 6 && state.settings.hiitAsDay) {
        advanceHiitRotation();
      }
      state.history.unshift({
        id: "history-" + Date.now(),
        type: "skip",
        day: state.currentDay,
        title: config.title,
        completedAt: new Date().toISOString(),
        freeChoiceMode: false,
        slots: []
      });

      state.totalDayAdvances += 1;
      state.currentDay = nextDayValue(state.currentDay);
      state.currentWorkout = null;
      saveState();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function handleFinishRecoveryDay() {
      const config = getDayConfig(state.currentDay);
      const hiitPlan = state.currentDay === 6 && state.settings.hiitAsDay ? getCurrentHiitPlan(false) : null;
      if (state.currentDay === 6 && state.settings.hiitAsDay) {
        advanceHiitRotation();
      }
      state.history.unshift({
        id: "history-" + Date.now(),
        type: "recovery-finish",
        day: state.currentDay,
        title: config.title,
        completedAt: new Date().toISOString(),
        freeChoiceMode: false,
        hiitFinisher: hiitPlan ? formatHiitPlan(hiitPlan) : null,
        hiitWeight: hiitPlan ? (state.hiit.weights[getHiitSessionKey(hiitPlan)] || "") : "",
        hiitSetsDone: hiitPlan ? (state.hiit.setsDone || 0) : 0,
        slots: []
      });

      state.totalDayAdvances += 1;
      state.currentDay = nextDayValue(state.currentDay);
      state.currentWorkout = null;
      saveState();
      launchConfetti();
      renderApp();
      switchTab(TABS.TODAY);
    }

            <label class="input-wrap">
              <span class="input-label">Eigen oefeningen</span>
              <textarea data-action="custom-exercises" data-pattern="secondary" data-subcategory="Secundair" placeholder="Typ oefeningen gescheiden door komma's of nieuwe regels">${escapeHtml(getEditorValue("secondary", "Secundair"))}</textarea>
            </label>
            <div class="button-row">
              <button class="secondary-button" type="button" data-action="reset-custom-subcategory" data-pattern="secondary" data-subcategory="Secundair">Herstel standaard</button>
            </div>
          </div>
        </article>
      `;

      view.innerHTML = `
        <div class="stack">
          <article class="card">
            <div class="card-header">
              <div>
                <h2>Eigen Oefeningen</h2>
                <p class="subtle">Vul per subcategorie je eigen oefeningen in. Laat een vak leeg om de standaardlijst te blijven gebruiken. Gebruik daarna save & reset om de huidige trainingsdag meteen opnieuw op te bouwen.</p>
              </div>
            </div>
            <div class="button-row">
              <button class="primary-button" type="button" id="saveResetCustomButton">Opslaan &amp; reset huidige dag</button>
              <button class="ghost-button" type="button" id="resetAllCustomButton">Reset alle eigen oefeningen</button>
            </div>
          </article>
          ${cards}
          ${secondaryCard}
        </div>
      `;

      bindCustomExerciseControls();
    }

    function bindCustomExerciseControls() {
      document.querySelectorAll('[data-action="custom-exercises"]').forEach((textarea) => {
        textarea.addEventListener("input", (event) => {
          const patternKey = event.target.getAttribute("data-pattern");
          const subcategory = event.target.getAttribute("data-subcategory");
          const parsed = parseExerciseEditorValue(event.target.value);

          if (patternKey === "secondary") {
            state.customExercises.secondary = parsed;
          } else {
            state.customExercises[patternKey] = state.customExercises[patternKey] || {};
            state.customExercises[patternKey][subcategory] = parsed;
          }

          saveState();
        });
      });

      const saveResetButton = document.getElementById("saveResetCustomButton");
      if (saveResetButton) {
        saveResetButton.addEventListener("click", () => {
          saveState();
          resetCurrentWorkoutWithLatestExercises();
          renderApp();
          switchTab(TABS.TODAY);
        });
      }

      document.querySelectorAll('[data-action="reset-custom-subcategory"]').forEach((button) => {
        button.addEventListener("click", () => {
          const patternKey = button.getAttribute("data-pattern");
          const subcategory = button.getAttribute("data-subcategory");

          if (patternKey === "secondary") {
            state.customExercises.secondary = [];
          } else if (state.customExercises[patternKey]) {
            delete state.customExercises[patternKey][subcategory];
          }

          saveState();
          renderApp();
          switchTab(TABS.CUSTOM);
        });
      });

      const resetAllButton = document.getElementById("resetAllCustomButton");
      if (resetAllButton) {
        resetAllButton.addEventListener("click", () => {
          const confirmed = window.confirm("Weet je zeker dat je alle eigen oefeningen wilt verwijderen en terug wilt naar de standaardlijsten?");
          if (!confirmed) {
            return;
          }
          state.customExercises = createDefaultCustomExercises();
          saveState();
          renderApp();
          switchTab(TABS.CUSTOM);
        });
      }
    }

    function previewNextExercise(patternKey, subcategory) {
      const options = getExerciseOptions(patternKey, subcategory);
      const key = getSubcategoryKey(patternKey, subcategory);
      const currentIndex = state.rotations.exercises[key] || 0;
      return options[currentIndex % options.length];
    }

    function previewNextSecondaryExercise() {
      const options = getExerciseOptions("secondary", "Secundair");
      const currentIndex = state.rotations.subcategories.secondary || 0;
      return options[currentIndex % options.length];
    }

    function handleReset() {
      const confirmed = window.confirm("Weet je zeker dat je alle voortgang, gewichten, nudges, rotaties en historie wilt resetten?");
      if (!confirmed) {
        return;
      }
      state = createDefaultState();
      saveState();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function updateHero() {
      document.getElementById("heroDayPill").textContent = dayLabel(state.currentDay) + " · " + getDayConfig(state.currentDay).title;
      document.getElementById("heroModePill").textContent = "Vrije keus " + (state.settings.freeChoice ? "aan" : "uit");
      document.getElementById("heroProgressPill").textContent = state.trainingSessionsCompleted + " trainingen afgerond";
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle("active", button.getAttribute("data-tab") === tabName);
      });
      document.querySelectorAll(".view").forEach((view) => {
        const targetId = tabName === TABS.TODAY
          ? "todayView"
          : tabName === TABS.OPTIONS
            ? "optionsView"
            : "customView";
        view.classList.toggle("active", view.id === targetId);
      });
    }

    function renderApp() {
      syncTimerState();
      updateHero();
      renderToday();
      renderOptions();
      renderCustomExercises();
      switchTab(activeTab || TABS.TODAY);
      updateTimerDisplay();
    }

    function launchConfetti() {
      const layer = document.getElementById("confettiLayer");
      layer.innerHTML = "";
      const colors = ["#406b5a", "#6fa18e", "#f1bf79", "#d68181", "#ffffff"];

      for (let index = 0; index < 70; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[index % colors.length];
        piece.style.animationDuration = 2200 + Math.random() * 1800 + "ms";
        piece.style.animationDelay = Math.random() * 120 + "ms";
        piece.style.setProperty("--drift", (Math.random() * 38 - 19).toFixed(2) + "vw");
        piece.style.setProperty("--spin", Math.round(Math.random() * 800 - 400) + "deg");
        layer.appendChild(piece);
      }

      window.setTimeout(() => {
        layer.innerHTML = "";
      }, 4200);
    }

    document.querySelectorAll(".tab-button").forEach((button) => {
      button.addEventListener("click", () => {
        switchTab(button.getAttribute("data-tab"));
      });
    });

    document.addEventListener("visibilitychange", () => {
      syncTimerState();
      updateTimerDisplay();
      updateWakeLock();
    });

    renderApp();
    switchTab(TABS.TODAY);
    startTimerLoop();
  </script>
</body>
</html>
