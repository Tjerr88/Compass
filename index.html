<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass</title>
  <style>
    :root {
      --bg: #e7dece;
      --bg-accent: #d8ccb5;
      --surface: rgba(251, 247, 239, 0.94);
      --surface-strong: #f7f1e4;
      --surface-soft: #efe5d3;
      --text: #2f2a22;
      --muted: #6f6557;
      --line: rgba(74, 58, 36, 0.14);
      --line-strong: rgba(74, 58, 36, 0.24);
      --shadow: 0 26px 60px rgba(67, 52, 31, 0.10);
      --shadow-soft: 0 14px 34px rgba(67, 52, 31, 0.08);
      --primary: #55624a;
      --primary-strong: #384437;
      --primary-soft: rgba(85, 98, 74, 0.10);
      --success: #567056;
      --warning: #a0713f;
      --danger: #9a5f50;
      --accent-metal: #8f744c;
      --font-body: "Aptos", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-display: "Palatino Linotype", "Book Antiqua", "Iowan Old Style", Georgia, serif;
      --radius-xl: 30px;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
      --max-width: 980px;
      --transition: 180ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(143, 116, 76, 0.12), transparent 30%),
        radial-gradient(circle at bottom right, rgba(85, 98, 74, 0.10), transparent 24%),
        linear-gradient(180deg, #f1eadc 0%, var(--bg) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255,252,246,0.38), transparent 24%),
        radial-gradient(circle at 20% 10%, rgba(255,248,234,0.32), transparent 18%),
        repeating-linear-gradient(90deg, rgba(111, 101, 87, 0.028) 0 1px, transparent 1px 24px);
      opacity: 0.9;
    }

    .app-shell {
      position: relative;
      width: min(calc(100% - 28px), var(--max-width));
      margin: 28px auto 48px;
      z-index: 1;
    }

    .hero {
      display: block;
      width: 100%;
      background:
        linear-gradient(180deg, rgba(255, 250, 242, 0.94), rgba(242, 234, 219, 0.94)),
        linear-gradient(90deg, rgba(143, 116, 76, 0.08), rgba(85, 98, 74, 0.05));
      border: 1px solid rgba(115, 91, 58, 0.18);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
      backdrop-filter: blur(10px);
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 12px;
      height: 10px;
      border-top: 1px solid rgba(143, 116, 76, 0.28);
      border-bottom: 1px solid rgba(143, 116, 76, 0.18);
      opacity: 0.9;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(85, 98, 74, 0.10);
      color: var(--primary-strong);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      border: 1px solid rgba(143, 116, 76, 0.18);
    }

    h1 {
      margin: 18px 0 10px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
      color: #2d241b;
    }

    .hero p {
      margin: 0;
      max-width: 60ch;
      color: var(--muted);
      line-height: 1.7;
    }

    .hero-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 0;
    }

    .pill {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(250, 245, 236, 0.92);
      border: 1px solid var(--line);
      font-size: 0.88rem;
      color: var(--text);
      box-shadow: 0 8px 18px rgba(67, 52, 31, 0.05);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 18px;
      padding: 7px;
      border-radius: 24px;
      background: rgba(245, 237, 224, 0.88);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(8px);
    }

    .tab-button {
      appearance: none;
      border: 0;
      border-radius: 16px;
      padding: 15px 16px;
      background: transparent;
      color: var(--muted);
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition), color var(--transition), transform var(--transition);
    }

    .tab-button.active {
      background: linear-gradient(135deg, #5c6a50, var(--primary-strong));
      color: #f8f1e4;
      box-shadow: 0 12px 26px rgba(56, 68, 55, 0.20);
    }

    .tab-button:active,
    .primary-button:active,
    .secondary-button:active,
    .nudge-button:active {
      transform: translateY(1px) scale(0.99);
    }

    .view {
      display: none;
      margin-top: 18px;
      animation: fadeIn 240ms ease;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(115, 91, 58, 0.14);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      padding: 22px;
      backdrop-filter: blur(10px);
    }

    .card.soft {
      background: rgba(248, 242, 232, 0.92);
    }

    .focus-card {
      position: relative;
      border-color: rgba(85, 98, 74, 0.20);
      background:
        linear-gradient(180deg, rgba(251, 246, 238, 0.96), rgba(241, 232, 215, 0.96));
    }

    .focus-card::before {
      content: "";
      display: block;
      width: 108px;
      height: 8px;
      margin-bottom: 10px;
      border-top: 1px solid rgba(143, 116, 76, 0.38);
      border-bottom: 1px solid rgba(143, 116, 76, 0.22);
    }

    .focus-card h3 {
      margin-top: 6px;
      margin-bottom: 8px;
      font-family: var(--font-display);
      font-size: 1.45rem;
      color: #30261d;
    }

    .focus-card .subtle {
      max-width: 70ch;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .card h2,
    .card h3,
    .card h4 {
      margin: 0;
      letter-spacing: -0.02em;
      font-family: var(--font-display);
      font-weight: 700;
    }

    .subtle {
      color: var(--muted);
      line-height: 1.55;
    }

    .day-banner {
      display: grid;
      gap: 14px;
    }

    .day-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      padding: 9px 12px;
      border-radius: 999px;
      background: rgba(85, 98, 74, 0.08);
      color: var(--primary-strong);
      border: 1px solid rgba(85, 98, 74, 0.14);
    }

    .slot-grid {
      display: grid;
      gap: 14px;
    }

    .group-grid {
      display: grid;
      gap: 16px;
    }

    .exercise-group {
      display: grid;
      gap: 14px;
      padding: 16px;
      border: 1px solid rgba(115, 91, 58, 0.13);
      border-radius: 22px;
      background: rgba(249, 243, 233, 0.64);
    }

    .group-heading {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .group-heading h4 {
      margin: 0;
      font-size: 1.08rem;
    }

    .group-slots {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .slot-card {
      background: linear-gradient(180deg, rgba(253,250,245,0.98), rgba(242,235,223,0.96));
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 10px 24px rgba(67, 52, 31, 0.06);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    .slot-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(67, 52, 31, 0.09);
      border-color: rgba(85, 98, 74, 0.16);
    }

    .slot-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .slot-kicker {
      margin: 0 0 6px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .slot-title {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.25;
    }

    .slot-chip {
      flex-shrink: 0;
      padding: 8px 10px;
      border-radius: 14px;
      background: rgba(242, 234, 220, 0.92);
      border: 1px solid var(--line);
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--primary-strong);
    }

    .exercise-name {
      margin: 3px 0 0;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
    }

    .nudge-line {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(85, 98, 74, 0.08);
      color: var(--primary-strong);
      font-size: 0.92rem;
    }

    .slot-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
    }

    .input-wrap {
      display: grid;
      gap: 8px;
    }

    .input-label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 1rem;
      color: var(--text);
      background: rgba(255, 251, 244, 0.96);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    input[type="text"]:focus {
      border-color: rgba(85, 98, 74, 0.42);
      box-shadow: 0 0 0 4px rgba(85, 98, 74, 0.08);
    }

    textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid var(--line-strong);
      border-radius: 14px;
      padding: 14px 15px;
      font: inherit;
      color: var(--text);
      background: rgba(255, 251, 244, 0.96);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    textarea:focus {
      border-color: rgba(85, 98, 74, 0.42);
      box-shadow: 0 0 0 4px rgba(85, 98, 74, 0.08);
    }

    .nudge-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nudge-button,
    .primary-button,
    .secondary-button,
    .ghost-button {
      appearance: none;
      border: 0;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition), border-color var(--transition);
    }

    .nudge-button {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255, 250, 243, 0.98);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(67, 52, 31, 0.05);
    }

    .nudge-button.active-up {
      background: rgba(63, 143, 101, 0.14);
      border-color: rgba(63, 143, 101, 0.35);
      color: var(--success);
    }

    .nudge-button.active-down {
      background: rgba(184, 92, 92, 0.14);
      border-color: rgba(184, 92, 92, 0.32);
      color: var(--danger);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .primary-button,
    .secondary-button,
    .ghost-button {
      min-height: 52px;
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
    }

    .primary-button:disabled,
    .secondary-button:disabled,
    .ghost-button:disabled {
      cursor: not-allowed;
      opacity: 0.52;
      transform: none;
      box-shadow: none;
    }

    .primary-button {
      background: linear-gradient(135deg, #607055, var(--primary-strong));
      color: #f7f1e4;
      box-shadow: 0 16px 24px rgba(56, 68, 55, 0.18);
    }

    .secondary-button {
      background: rgba(250, 245, 236, 0.96);
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: 0 10px 18px rgba(67, 52, 31, 0.05);
    }

    .ghost-button {
      background: rgba(173, 90, 90, 0.10);
      color: var(--danger);
      border: 1px solid rgba(173, 90, 90, 0.16);
    }

    .today-empty {
      text-align: center;
      padding: 28px 20px;
    }

    .action-card {
      display: grid;
      gap: 16px;
      text-align: left;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(254, 251, 245, 0.98), rgba(241, 233, 218, 0.96)),
        linear-gradient(120deg, rgba(85, 98, 74, 0.06), rgba(143, 116, 76, 0.04));
    }

    .action-card::before {
      content: "";
      position: absolute;
      left: 22px;
      right: 22px;
      top: 14px;
      height: 8px;
      border-top: 1px solid rgba(143, 116, 76, 0.28);
      border-bottom: 1px solid rgba(143, 116, 76, 0.14);
      pointer-events: none;
    }

    .action-card > * {
      position: relative;
      z-index: 1;
    }

    .action-kicker {
      margin: 0 0 6px;
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--accent-metal);
    }

    .action-card .card-header {
      margin-top: 10px;
    }

    .action-value {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.04;
      color: #2c241a;
    }

    .action-support {
      margin: -2px 0 0;
      font-size: 0.96rem;
      color: var(--muted);
    }

    .session-overview {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }

    .overview-card {
      padding: 16px;
      border-radius: 18px;
      background: rgba(255, 252, 247, 0.82);
      border: 1px solid rgba(115, 91, 58, 0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.5);
    }

    .overview-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.77rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 800;
      color: var(--muted);
    }

    .overview-value {
      display: block;
      font-size: 1rem;
      line-height: 1.35;
      color: var(--text);
      font-weight: 700;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(253,249,243,0.98), rgba(241,234,222,0.96));
      border: 1px solid var(--line);
    }

    .switch {
      position: relative;
      width: 62px;
      height: 36px;
      flex-shrink: 0;
    }

    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(24, 39, 34, 0.16);
      border-radius: 999px;
      transition: background var(--transition);
    }

    .slider::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 8px 16px rgba(20, 38, 32, 0.18);
      transition: transform var(--transition);
    }

    .switch input:checked + .slider {
      background: linear-gradient(135deg, #607055, var(--primary-strong));
    }

    .switch input:checked + .slider::before {
      transform: translateX(26px);
    }

    .stats-grid,
    .library-grid,
    .history-grid {
      display: grid;
      gap: 14px;
    }

    .stats-grid {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    }

    .library-grid {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .stat-card,
    .mini-card {
      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(253,249,243,0.98), rgba(241,234,222,0.96));
      border: 1px solid var(--line);
      box-shadow: 0 10px 22px rgba(67, 52, 31, 0.05);
    }

    .stat-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.86rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 800;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .mini-card h4 {
      margin-bottom: 8px;
      font-size: 1.02rem;
    }

    .recovery-slider-card {
      gap: 12px;
      background:
        linear-gradient(180deg, rgba(255, 252, 247, 0.98), rgba(243, 236, 225, 0.96));
    }

    .recovery-slider-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .recovery-slider-value {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--primary-strong);
      letter-spacing: -0.03em;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary-strong);
    }

    .score-panel {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    }

    .score-panel .overview-value {
      font-size: 1.2rem;
    }

    .finished-card {
      text-align: center;
      justify-items: center;
      padding-top: 30px;
      padding-bottom: 28px;
    }

    .finished-mark {
      width: 72px;
      height: 72px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      color: #f7f1e4;
      background: linear-gradient(135deg, #607055, var(--primary-strong));
      box-shadow: 0 16px 30px rgba(56, 68, 55, 0.22);
    }

    .finished-card .action-value,
    .finished-card .action-support,
    .finished-card .subtle {
      text-align: center;
      max-width: 50ch;
    }

    .inline-list,
    .detail-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .inline-list li,
    .detail-list li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(24, 49, 42, 0.08);
      color: var(--muted);
    }

    .inline-list li:last-child,
    .detail-list li:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .detail-list strong {
      color: var(--text);
    }

    .history-item {
      padding: 18px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(244, 246, 244, 0.94));
      border: 1px solid var(--line);
      box-shadow: 0 10px 20px rgba(67, 52, 31, 0.04);
    }

    .history-item h4 {
      margin-bottom: 10px;
    }

    .history-meta {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 12px;
      line-height: 1.45;
    }

    .history-summary {
      color: var(--text);
      line-height: 1.55;
    }

    .history-item .day-badges {
      margin-bottom: 12px;
      gap: 8px;
    }

    .history-item .badge {
      padding: 7px 10px;
      font-size: 0.82rem;
    }

    .muted-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .accordion {
      overflow: hidden;
    }

    .accordion summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 800;
      font-size: 1rem;
    }

    .accordion summary::-webkit-details-marker {
      display: none;
    }

    .accordion summary::after {
      content: "+";
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(64, 107, 90, 0.10);
      color: var(--primary-strong);
      font-size: 1.15rem;
      flex-shrink: 0;
      transition: transform var(--transition), background var(--transition);
    }

    .accordion[open] summary::after {
      transform: rotate(45deg);
      background: rgba(64, 107, 90, 0.16);
    }

    .accordion-body {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(24, 49, 42, 0.08);
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      const copy = Array.isArray(array) ? array.slice() : [];
      for (let index = copy.length - 1; index > 0; index -= 1) {
        const swapIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[swapIndex]] = [copy[swapIndex], copy[index]];
      }
      return copy;

        && value.text.trim();
    }

    function loadFocusBag() {
      try {
        const raw = localStorage.getItem(LS_FOCUS_BAG_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed)) {
            const validLessons = parsed.filter(isValidFocusLesson);
            if (validLessons.length) {
              return validLessons;
            }
          }
        }
      } catch (error) {
        console.warn("Kon focus-bag niet laden, nieuwe bag wordt gemaakt.", error);
      }

      const freshBag = shuffle(STOIC_FOCUS_LESSONS);
      localStorage.setItem(LS_FOCUS_BAG_KEY, JSON.stringify(freshBag));
      return freshBag;
    }

    function drawFocus() {
      let bag = loadFocusBag();
      let previousFocus = null;

      try {
        const raw = localStorage.getItem(LS_FOCUS_TODAY_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (isValidFocusLesson(parsed)) {
            previousFocus = parsed;
          }
        }
      } catch (error) {
        console.warn("Kon vorige focus niet lezen.", error);
      }

      if (!bag.length) {
        bag = shuffle(STOIC_FOCUS_LESSONS);
      }

      if (
        previousFocus
        && bag.length > 1
        && bag[0]
        && bag[0].title === previousFocus.title
        && bag[0].text === previousFocus.text
      ) {
        const swapIndex = bag.findIndex((lesson) => lesson.title !== previousFocus.title || lesson.text !== previousFocus.text);
        if (swapIndex > 0) {
          [bag[0], bag[swapIndex]] = [bag[swapIndex], bag[0]];
        }
      }

      const focus = bag.shift() || STOIC_FOCUS_LESSONS[0];

      if (!bag.length) {
        bag = shuffle(STOIC_FOCUS_LESSONS);
        if (
          bag.length > 1
          && bag[0]
          && bag[0].title === focus.title
          && bag[0].text === focus.text
        ) {
          const swapIndex = bag.findIndex((lesson) => lesson.title !== focus.title || lesson.text !== focus.text);
          if (swapIndex > 0) {
            [bag[0], bag[swapIndex]] = [bag[swapIndex], bag[0]];
          }
        }
      }

      localStorage.setItem(LS_FOCUS_BAG_KEY, JSON.stringify(bag));
      return focus;
    }

    function getTodayFocus() {
      const today = getTodayKey();
      const cachedDay = localStorage.getItem(LS_FOCUS_DAY_KEY);

      if (cachedDay === today) {
        try {
          const raw = localStorage.getItem(LS_FOCUS_TODAY_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (isValidFocusLesson(parsed)) {
              return parsed;
            }
          }
        } catch (error) {
          console.warn("Kon focus van vandaag niet laden.", error);
        }
      }

      const focus = drawFocus();
      localStorage.setItem(LS_FOCUS_DAY_KEY, today);
      localStorage.setItem(LS_FOCUS_TODAY_KEY, JSON.stringify(focus));
      return focus;
    }

    function getTrainingStyle() {
      return TRAINING_STYLE_OPTIONS[state.settings.trainingStyle] || TRAINING_STYLE_OPTIONS.strength;
    }

    function getSlotPrescription(slot) {
      if (slot.slotType === "main") {
        return getTrainingStyle().mainPrescription;
      }
      if (slot.patternKey === "core") {
        return getTrainingStyle().corePrescription || "2-3 sets van 10 reps";
      }
      if (slot.patternKey === "secondary") {
        return getTrainingStyle().secondaryPrescription || "2-3 sets van 12 reps";
      }
      return "";
    }

    function resetCurrentWorkoutWithLatestExercises() {
      if (!state.currentWorkout) {
        return false;
      }

      if (state.currentWorkout.rotationSnapshot) {
        state.rotations = cloneRotations(state.currentWorkout.rotationSnapshot);
      }

      state.currentWorkout = null;
      saveState();
      return true;
    }

    function createDefaultRecoveryCheckin() {
      return {
        energy: 3,
        body: 3,
        mind: 3,
        submittedAt: null
      };
    }

    function getTodayRecoveryCheckin() {
      return state.recoveryCheckins[getTodayKey()] || null;
    }

    function getRecoveryTotal(checkin) {
      return RECOVERY_FIELDS.reduce((sum, field) => sum + Number(checkin[field.key] || 0), 0);
    }

    function getRecoveryBand(total) {
      if (total <= RECOVERY_BANDS.override.max) {
        return RECOVERY_BANDS.override;
      }
      if (total <= RECOVERY_BANDS.low.max) {
        return RECOVERY_BANDS.low;
      }
      if (total <= RECOVERY_BANDS.medium.max) {
        return RECOVERY_BANDS.medium;
      }
      return RECOVERY_BANDS.high;
    }

    function getLocalDayStart(value) {
      const date = new Date(value);
      return new Date(date.getFullYear(), date.getMonth(), date.getDate());
    }

    function getDaysSinceDate(value) {
      const msPerDay = 24 * 60 * 60 * 1000;
      const today = getLocalDayStart(new Date());
      const then = getLocalDayStart(value);
      return Math.floor((today - then) / msPerDay);
    }

    function getLastCompletedSession() {
      return state.history.find((item) => item.type !== "skip") || null;
    }

    function getLastCompletedSessionByType(sessionType) {
      return state.history.find((item) => item.type !== "skip" && item.sessionType === sessionType) || null;
    }

    function getConsecutiveTrainingSessionCount() {
      const sessionTypesThatCount = new Set(["strength", "zone2", "hiit"]);
      let count = 0;

      for (const item of state.history) {
        if (item.type === "skip") {
          break;
        }

        if (!sessionTypesThatCount.has(item.sessionType)) {
          break;
        }

        count += 1;
      }

      return count;
    }

    function getBaseSessionTypeFromHistory() {
      if (getConsecutiveTrainingSessionCount() >= 3) {
        return "recovery";
      }

      const lastSession = getLastCompletedSession();
      if (!lastSession || lastSession.sessionType !== "strength") {
        return "strength";
      }

      const lastZone2 = getLastCompletedSessionByType("zone2");
      if (!lastZone2 || getDaysSinceDate(lastZone2.completedAt) > 7) {
        return "zone2";
      }

      const lastHiit = getLastCompletedSessionByType("hiit");
      if (!lastHiit || getDaysSinceDate(lastHiit.completedAt) > 7) {
        return "hiit";
      }

      return "recovery";
    }

    function getStrengthDose(bandKey) {
      const trainingStyle = getTrainingStyle();
      if (bandKey === "low") {
        return {
          title: "Minimum Strength",
          summary: "Today includes only Main A and Main B, with 3 sets of 6-12 at RIR 4.",
          guidance: [
            "Main A and Main B.",
            ...trainingStyle.mainGuidance,
            "RIR 4. Ruim stoppen voor traagheid of techniekverlies.",
            "No core and no secondary."
          ]
        };
      }
      if (bandKey === "medium") {
        return {
          title: "Essential Strength",
          summary: "Today includes Main A and Main B, with core work at the end.",
          guidance: [
            (trainingStyle.coreGuidance || "Core at the end: 2 sets of 10-12."),
            ...trainingStyle.mainGuidance,
            "No secondary."
          ]
        };
      }
      return {
        title: "Full Strength",
        summary: "Today includes Main A and Main B, with core and secondary work at the end.",
        guidance: [
          ...trainingStyle.mainGuidance,
          (trainingStyle.supportGuidance || "Core and secondary both come at the end."),
          "Build day: take volume if quality stays high."
        ]
      };
    }

    function getRecoveryDayDose(bandKey) {
      if (bandKey === "low") {
        return {
          title: "Exploration",
          summary: "Ground Force Exploration.",
          guidance: [
            "Keep movement easy and playful.",
            "Unloaded, curious, and without performance pressure."
          ]
        };
      }
      if (bandKey === "medium") {
        return {
          title: "General Mobility",
          summary: "Full mobility practice.",
          guidance: [
            "Calm, structured and recovery-focused.",
            "Move smoothly through the mobility practice."
          ]
        };
      }
      return {
        title: "Kettlebell Mobility",
        summary: "Loaded mobility.",
        guidance: [
          "Control under light load.",
          "Move with more control, do not force it."
        ]
      };
    }

    function getZone2Minutes(bandKey) {
      return bandKey === "low" ? 20 : bandKey === "medium" ? 30 : 45;
    }

    function getHiitSetTarget(bandKey) {
      return bandKey === "low" ? 6 : bandKey === "medium" ? 8 : 10;
    }

    function getTodayPlan() {
      const dateKey = getTodayKey();
      const checkin = getTodayRecoveryCheckin();
      const baseSessionType = getBaseSessionTypeFromHistory();
      if (!checkin || !checkin.submittedAt) {
        return {
          dateKey,
          pendingCheckin: true,
          baseSessionType
        };
      }

      const total = getRecoveryTotal(checkin);
      const band = getRecoveryBand(total);
      if (band.key === "override") {
        return {
          dateKey,
          checkin,
          total,
          band,
          baseSessionType,
          effectiveSessionType: "breatheRest",
          title: "Breathe & Rest",
          subtitle: "Below 8, recovery always wins.",
          summary: "Today, recovery is the training."
        };
      }

      if (baseSessionType === "strength") {
        const dose = getStrengthDose(band.key);
        return {
          dateKey,
          checkin,
          total,
          band,
          baseSessionType,
          effectiveSessionType: "strength",
          title: dose.title,
          subtitle: dose.summary,
          summary: "Usage sets the direction. Recovery sets the dose.",
          strengthDose: dose
        };
      }

      if (baseSessionType === "zone2") {
        const minutes = getZone2Minutes(band.key);
        return {
          dateKey,
          checkin,
          total,
          band,
          baseSessionType,
          effectiveSessionType: "zone2",
          title: "Zone 2",
          subtitle: minutes + " minutes of easy cardio.",
          summary: "Zone 2 is dosed based on recovery.",
          zone2Minutes: minutes
        };
      }

      if (baseSessionType === "hiit") {
        const hiitSets = getHiitSetTarget(band.key);
        return {
          dateKey,
          checkin,
          total,
          band,
          baseSessionType,
          effectiveSessionType: "hiit",
          title: "HIIT",
          subtitle: hiitSets + " sets today.",
          summary: band.key === "low"
            ? "If the warm-up feels off, switch to Breathe & Rest or Exploration."
            : "Short, sharp output within quality.",
          hiitSets
        };
      }

      const recoveryDose = getRecoveryDayDose(band.key);
      return {
        dateKey,
        checkin,
        total,
        band,
        baseSessionType,
        effectiveSessionType: "recovery",
        title: recoveryDose.title,
        subtitle: recoveryDose.summary,
        summary: "Recovery day comes from your logbook; the score chooses the format.",
        recoveryDose
      };
    }

    function getSubcategoryKey(patternKey, subcategory) {
      return patternKey + "::" + subcategory;
    }

    function getStandardExerciseOptions(patternKey, subcategory) {
      if (patternKey === "secondary") {
        return PROGRAM.secondary.exercises.slice();
      }
      return (PROGRAM[patternKey].exercises[subcategory] || []).slice();
    }

    function getCustomExerciseOptions(patternKey, subcategory) {
      if (patternKey === "secondary") {
        return Array.isArray(state.customExercises.secondary) ? state.customExercises.secondary : [];
      }
      const group = state.customExercises[patternKey] || {};
      return Array.isArray(group[subcategory]) ? group[subcategory] : [];
    }

    function getExerciseOptions(patternKey, subcategory) {
      const custom = getCustomExerciseOptions(patternKey, subcategory).filter(Boolean);
      if (custom.length) {
        return custom;
      }
      return getStandardExerciseOptions(patternKey, subcategory);
    }

    function getNextSubcategory(patternKey) {
      const pattern = PROGRAM[patternKey];
      const list = pattern.subcategories;
      const currentIndex = state.rotations.subcategories[patternKey] || 0;
      const subcategory = list[currentIndex % list.length];
      state.rotations.subcategories[patternKey] = currentIndex + 1;
      return subcategory;
    }

    function getNextExercise(patternKey, subcategory) {
      const options = getExerciseOptions(patternKey, subcategory);
      const key = getSubcategoryKey(patternKey, subcategory);
      const currentIndex = state.rotations.exercises[key] || 0;
      const exercise = options[currentIndex % options.length];
      state.rotations.exercises[key] = currentIndex + 1;
      return exercise;
    }

    function getNextSecondaryExercise() {
      const options = getExerciseOptions("secondary", "Secondary");
      const currentIndex = state.rotations.subcategories.secondary || 0;
      const exercise = options[currentIndex % options.length];
      state.rotations.subcategories.secondary = currentIndex + 1;
      return exercise;
    }

    function getExerciseRecord(exercise) {
      if (!state.records.exercises[exercise]) {
        state.records.exercises[exercise] = {
          lastValue: "",
          pendingNudge: null
        };
      }
      return state.records.exercises[exercise];
    }

    function buildPreviousText(lastValue, pendingNudge) {
      if (!lastValue) {
        return "";
      }
      if (pendingNudge === "up") {
        return "Last time: " + lastValue + " -- probeer iets zwaarder";
      }
      if (pendingNudge === "down") {
        return "Last time: " + lastValue + " -- probeer iets lichter";
      }
      return "Last time: " + lastValue;
    }

    function createAutoSlot(id, slotType, patternKey, titleOverride) {
      const pattern = PROGRAM[patternKey];
      const subcategory = getNextSubcategory(patternKey);
      const exercise = getNextExercise(patternKey, subcategory);
      const record = getExerciseRecord(exercise);
      const previousText = buildPreviousText(record.lastValue, record.pendingNudge);
      const inputValue = record.lastValue || "";
      const slot = {
        id,
        slotType,
        patternKey,
        label: titleOverride || pattern.label,
        subcategory,
        exercise,
        previousText,
        inputValue,
        nudgeChoice: null
      };
      record.pendingNudge = null;
      return slot;
    }

    function createFreeChoiceSlot(id, slotType, patternKey, titleOverride) {
      const pattern = PROGRAM[patternKey];
      const subcategory = patternKey === "secondary" ? "Secondary" : getNextSubcategory(patternKey);
      return {
        id,
        slotType,
        patternKey,
        label: titleOverride || pattern.label,
        subcategory,
        exercise: null,
        previousText: "",
        inputValue: "",
        nudgeChoice: null
      };
    }

    function createSecondarySlot(id, freeChoiceMode) {
      if (freeChoiceMode) {
        return createFreeChoiceSlot(id, "secondary", "secondary", "Secondary");
      }
      const exercise = getNextSecondaryExercise();
      const record = getExerciseRecord(exercise);
      const slot = {
        id,
        slotType: "secondary",
        patternKey: "secondary",
        label: "Secondary",
        subcategory: "Secondary",
        exercise,
        previousText: buildPreviousText(record.lastValue, record.pendingNudge),
        inputValue: record.lastValue || "",
        nudgeChoice: null
      };
      record.pendingNudge = null;
      return slot;
    }

    function rotateMainOrder() {
      const order = MAIN_ORDERS[state.rotations.mainOrderIndex % MAIN_ORDERS.length];
      state.rotations.mainOrderIndex += 1;
      return order;
    }

    function ensureCurrentWorkout(plan) {
      if (!plan || plan.effectiveSessionType !== "strength") {
        return;
      }

      if (state.currentWorkout) {
        return;
      }

      const freeChoiceMode = !!state.settings.freeChoice;
      const rotationSnapshot = cloneRotations(state.rotations);
      const mainOrder = rotateMainOrder();
      const slots = [];

      if (freeChoiceMode) {
        slots.push(createFreeChoiceSlot("core", "core", "core", "Core"));
      } else {
        slots.push(createAutoSlot("core", "core", "core", "Core"));
      }

      mainOrder.forEach((patternKey, index) => {
        const slotId = "main-" + index;
        if (freeChoiceMode) {
          slots.push(createFreeChoiceSlot(slotId, "main", patternKey));
        } else {
          slots.push(createAutoSlot(slotId, "main", patternKey));
        }
      });

      slots.push(createSecondarySlot("secondary", freeChoiceMode));

      state.currentWorkout = {
        id: "workout-" + Date.now(),
        planDate: plan.dateKey,
        generatedAt: new Date().toISOString(),
        freeChoiceMode,
        rotationSnapshot,
        order: mainOrder,
        slots
      };
      saveState();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function renderFocusOfTheDay() {
      const focus = getTodayFocus();
      return `
        <article class="card soft focus-card">
          <p class="slot-kicker">Focus of the Day</p>
          <h3>${escapeHtml(focus.title)}</h3>
          <p class="subtle">${escapeHtml(focus.text)}</p>
        </article>
      `;
    }

    function formatDateTime(value) {
      try {
        return new Date(value).toLocaleString("nl-NL", {
          dateStyle: "medium",
          timeStyle: "short"
        });
      } catch (error) {
        return value;
      }
    }

    function getDateKeyFromValue(value) {
      const date = new Date(value);
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return year + "-" + month + "-" + day;
    }

    function getLastLoggedItem() {
      return state.history[0] || null;
    }

    function isTodayClosed() {
      const lastItem = getLastLoggedItem();
      return !!(lastItem && getDateKeyFromValue(lastItem.completedAt) === getTodayKey());
    }

    function getCurrentHiitOption() {
      return formatHiitPlan(getCurrentHiitPlan());
    }

    function getCurrentHiitPlan() {
      const currentIndex = state.rotations.subcategories.hiit || 0;
      const plan = HIIT_PLANS[currentIndex % HIIT_PLANS.length];
      const todayPlan = getTodayPlan();
      const targetSets = todayPlan.hiitSets || 8;
      return {
        ...plan,
        optionIndex: currentIndex % HIIT_PLANS.length,
        mode: "full",
        targetSets
      };
    }

    function formatHiitPlan(plan) {
      return plan.name + ": " + plan.targetSets + " x " + plan.workSec + " sec hard / " + getHiitRestSeconds(plan) + " sec rust.";
    }

    function getHiitRestSeconds(plan) {
      const savedRest = Number(state.hiit.restDurations[getHiitSessionKey(plan)]);
      return savedRest > 0 ? savedRest : plan.restSec;
    }

    function advanceHiitRotation() {
      state.rotations.subcategories.hiit = (state.rotations.subcategories.hiit || 0) + 1;
    }

    function formatSeconds(totalSeconds) {
      const safeSeconds = Math.max(0, totalSeconds);
      const minutes = Math.floor(safeSeconds / 60);
      const seconds = safeSeconds % 60;
      return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
    }

    function getRestTimerKeys() {
      return Object.keys(state.timers || {});
    }

    function getTimerState(timerKey) {
      return state.timers[timerKey];
    }

    function getRemainingSeconds(timerKey) {
      const timer = getTimerState(timerKey);
      if (!timer.running || !timer.endTime) {
        return timer.lastDurationSec || (timerKey === "short" ? 60 : 180);
      }
      const diffMs = timer.endTime - Date.now();
      return Math.max(0, Math.ceil(diffMs / 1000));
    }

    function syncTimerState() {
      getRestTimerKeys().forEach((timerKey) => {
        const timer = getTimerState(timerKey);
        if (!timer.running || !timer.endTime) {
          return;
        }
        if (Date.now() >= timer.endTime && !timer.beeped) {
          timer.beeped = true;
          timer.running = false;
          saveState();
          playBeep(1046);
        }
      });
      syncHiitTimerState();
      updateWakeLock();
    }

    function startRestTimer(timerKey, durationSec) {
      const timer = getTimerState(timerKey);
      timer.lastDurationSec = durationSec;
      timer.endTime = Date.now() + (durationSec * 1000);
      timer.running = true;
      timer.beeped = false;
      saveState();
      startTimerLoop();
      updateWakeLock();
      renderApp();
    }

    function stopRestTimer(timerKey) {
      const timer = getTimerState(timerKey);
      timer.running = false;
      timer.endTime = null;
      timer.beeped = false;
      saveState();
      updateWakeLock();
      renderApp();
    }

    function startTimerLoop() {
      if (timerIntervalId) {
        return;
      }
      timerIntervalId = window.setInterval(() => {
        syncTimerState();
        updateTimerDisplay();
      }, 250);
    }

    function updateTimerDisplay() {
      getRestTimerKeys().forEach((timerKey) => {
        const display = document.getElementById("timerDisplay-" + timerKey);
        if (display) {
          display.textContent = formatSeconds(getRemainingSeconds(timerKey));
        }
      });
      const hiitDisplay = document.getElementById("hiitTimerDisplay");
      if (hiitDisplay) {
        hiitDisplay.textContent = formatSeconds(getHiitRemainingSeconds());
      }
      const anyRunning = getRestTimerKeys().some((timerKey) => getTimerState(timerKey).running) || state.hiit.timer.running;
      if (!anyRunning && timerIntervalId) {
        window.clearInterval(timerIntervalId);
        timerIntervalId = null;
      }
      updateWakeLock();
    }

    function playBeep(frequency) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return;
        }
        const context = new AudioContextClass();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = frequency || 880;
        gain.gain.setValueAtTime(0.001, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.18, context.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.55);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.55);
      } catch (error) {
        console.warn("Beep kon niet worden afgespeeld.", error);
      }
    }

    function getHiitSessionKey(plan) {
      return plan.mode + "-" + plan.optionIndex;
    }

    function prepareHiitSession(plan) {
      const changedPlan = state.hiit.activeOptionIndex !== plan.optionIndex || state.hiit.activeMode !== plan.mode;
      if (changedPlan) {
        state.hiit.activeOptionIndex = plan.optionIndex;
        state.hiit.activeMode = plan.mode;
        state.hiit.setsDone = 0;
        state.hiit.timer.running = false;
        state.hiit.timer.endTime = null;
        state.hiit.timer.phase = "idle";
        state.hiit.timer.beeped = false;
        saveState();
      }
    }

    function getHiitRemainingSeconds() {
      const timer = state.hiit.timer;
      if (!timer.running || !timer.endTime) {
        const plan = getCurrentHiitPlan(state.hiit.activeMode === "half");
        return timer.phase === "rest" ? getHiitRestSeconds(plan) : plan.workSec;
      }
      return Math.max(0, Math.ceil((timer.endTime - Date.now()) / 1000));
    }

    function syncHiitTimerState() {
      const timer = state.hiit.timer;
      if (!timer.running || !timer.endTime || Date.now() < timer.endTime || timer.beeped) {
        return;
      }

      const plan = getCurrentHiitPlan(state.hiit.activeMode === "half");
      timer.beeped = true;
      playBeep(timer.phase === "work" ? 1175 : 880);

      if (timer.phase === "work") {
        state.hiit.setsDone = Math.min(plan.targetSets, (state.hiit.setsDone || 0) + 1);
        timer.phase = state.hiit.setsDone >= plan.targetSets ? "done" : "rest";
        timer.running = false;
        timer.endTime = null;
      } else {
        timer.phase = "idle";
        timer.running = false;
        timer.endTime = null;
      }
      saveState();
      renderApp();
    }

    function startHiitPhase(phase) {
      const plan = getCurrentHiitPlan(state.hiit.activeMode === "half");
      if (state.hiit.setsDone >= plan.targetSets && phase === "work") {
        state.hiit.setsDone = 0;
      }
      state.hiit.timer.phase = phase;
      state.hiit.timer.endTime = Date.now() + ((phase === "rest" ? getHiitRestSeconds(plan) : plan.workSec) * 1000);
      state.hiit.timer.running = true;
      state.hiit.timer.beeped = false;
      saveState();
      startTimerLoop();
      updateWakeLock();
      renderApp();
    }

    function stopHiitTimer() {
      state.hiit.timer.running = false;
      state.hiit.timer.endTime = null;
      state.hiit.timer.beeped = false;
      saveState();
      updateWakeLock();
      renderApp();
    }

    function resetHiitSets() {
      state.hiit.setsDone = 0;
      state.hiit.timer.running = false;
      state.hiit.timer.endTime = null;
      state.hiit.timer.phase = "idle";
      state.hiit.timer.beeped = false;
      saveState();
      updateWakeLock();
      renderApp();
    }

    function updateHiitWeight(value) {
      const plan = getCurrentHiitPlan(state.hiit.activeMode === "half");
      state.hiit.weights[getHiitSessionKey(plan)] = value;
      saveState();
    }

    function updateHiitRestDuration(value) {
      const plan = getCurrentHiitPlan(state.hiit.activeMode === "half");
      const restSeconds = Math.max(15, Math.min(240, Number(value) || plan.restSec));
      state.hiit.restDurations[getHiitSessionKey(plan)] = restSeconds;
      if (!state.hiit.timer.running && state.hiit.timer.phase === "rest") {
        state.hiit.timer.endTime = null;
      }
      saveState();
      renderApp();
    }

    function anyTimerRunning() {
      return getRestTimerKeys().some((timerKey) => getTimerState(timerKey).running) || state.hiit.timer.running;
    }

    async function requestWakeLock() {
      if (wakeLock || !("wakeLock" in navigator) || document.visibilityState !== "visible") {
        return;
      }
      try {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => {
          wakeLock = null;
        });
      } catch (error) {
        wakeLock = null;
      }
    }

    async function releaseWakeLock() {
      if (!wakeLock) {
        return;
      }
      try {
        await wakeLock.release();
      } catch (error) {
        wakeLock = null;
      }
    }

    function updateWakeLock() {
      if (anyTimerRunning()) {
        requestWakeLock();
      } else {
        releaseWakeLock();
      }
    }

    function renderTrainingGroups(workout, plan) {
      const coreSlot = workout.slots.find((slot) => slot.slotType === "core");
      const mainSlots = workout.slots.filter((slot) => slot.slotType === "main");
      const secondarySlot = workout.slots.find((slot) => slot.slotType === "secondary");
      const showCore = plan.band.key !== "low";
      const showSecondary = plan.band.key === "high";
      const supportSlots = [];

      if (showCore && coreSlot) {
        supportSlots.push(coreSlot);
      }
      if (showSecondary && secondarySlot) {
        supportSlots.push(secondarySlot);
      }

      const groups = [
        { id: "groupA", title: "Main A", subtitle: "First superset", slots: mainSlots.slice(0, 2) },
        { id: "groupB", title: "Main B", subtitle: "Second superset", slots: mainSlots.slice(2, 4) }
      ];

      if (supportSlots.length) {
        groups.push({
          id: "groupC",
          title: showSecondary ? "Support" : "Core",
          subtitle: showSecondary ? "Core and secondary at the end" : "Core at the end",
          slots: supportSlots
        });
      }

      return `
        <div class="group-grid">
          ${groups.map((group) => renderExerciseGroup(group, workout.freeChoiceMode)).join("")}
        </div>
      `;
    }

    function renderExerciseGroup(group, freeChoiceMode) {
      return `
        <section class="exercise-group">
          <div class="group-heading">
            <div>
              <h4>${escapeHtml(group.title)}</h4>
              <p class="subtle">${escapeHtml(group.subtitle)}</p>
            </div>
            <div class="slot-chip">${group.slots.length} exercises</div>
          </div>
          <div class="group-slots">
            ${group.slots.map((slot) => renderSlot(slot, freeChoiceMode)).join("")}
          </div>
          ${renderGroupTimer(group.id)}
        </section>
      `;
    }

    function renderGroupTimer(timerKey) {
      const timer = getTimerState(timerKey);
      return `
        <div class="mini-card">
          <div class="timer-row centered">
            <div>
              <div class="slot-kicker">Rest between these exercises</div>
              <div class="timer-display" id="timerDisplay-${escapeHtml(timerKey)}">${formatSeconds(getRemainingSeconds(timerKey))}</div>
            </div>
          </div>
          <div class="timer-options">
            ${GROUP_REST_OPTIONS.map((seconds) => `
              <button class="primary-button" type="button" data-action="group-timer-start" data-timer-key="${escapeHtml(timerKey)}" data-duration="${seconds}">
                ${timer.running && timer.lastDurationSec === seconds ? "Restart" : "Start"} ${formatSeconds(seconds)}

    function renderSlot(slot, freeChoiceMode) {
      const nudgeMarkup = !freeChoiceMode && slot.previousText
        ? `<div class="nudge-line">${escapeHtml(slot.previousText)}</div>`
        : "";
      const prescription = getSlotPrescription(slot);
      const exerciseMarkup = freeChoiceMode
        ? ""
        : `<p class="exercise-name">${escapeHtml(slot.exercise)}</p>`;
      const prescriptionMarkup = prescription
        ? `<div class="nudge-line">${escapeHtml(prescription)}</div>`
        : "";
      const controlsMarkup = freeChoiceMode
        ? ""
        : `
          <div class="slot-controls">
            <label class="input-wrap">
              <span class="input-label">Load / note</span>
              <input
                type="text"
                value="${escapeHtml(slot.inputValue || "")}"
                placeholder="E.g. 24 kg or 2x8"
                data-action="slot-input"
                data-slot-id="${escapeHtml(slot.id)}"
              >
            </label>
            <div class="nudge-controls">
              <button class="nudge-button ${slot.nudgeChoice === "down" ? "active-down" : ""}" type="button" data-action="nudge" data-slot-id="${escapeHtml(slot.id)}" data-direction="down" aria-label="A little lighter next time">-</button>
              <button class="nudge-button ${slot.nudgeChoice === "up" ? "active-up" : ""}" type="button" data-action="nudge" data-slot-id="${escapeHtml(slot.id)}" data-direction="up" aria-label="A little heavier next time">+</button>
            </div>
          </div>
        `;

      return `
        <article class="slot-card">
          <div class="slot-top">
            <div>
              <p class="slot-kicker">${escapeHtml(slot.label)}</p>
              <h4 class="slot-title">${escapeHtml(slot.subcategory)}</h4>
              ${exerciseMarkup}
              ${prescriptionMarkup}
            </div>
            <div class="slot-chip">${escapeHtml(slot.slotType === "main" ? "Main" : slot.label)}</div>
          </div>
          ${nudgeMarkup}
          ${controlsMarkup}
        </article>
      `;
    }

    function renderHiitCard() {

      const restSeconds = getHiitRestSeconds(plan);
      const phaseLabel = timer.phase === "work"
        ? "Werk"

          ? "Rest"
          : timer.phase === "done"
            ? "Done"
            : "Ready for set";
      const startLabel = timer.running
        ? "Timer loopt"
        : timer.phase === "rest"

          : state.hiit.setsDone >= plan.targetSets
            ? "Reset and start"
            : "Start set";

      return `
        <article class="slot-card hiit-panel">
          <div class="slot-top">
            <div>
              <p class="slot-kicker">HIIT</p>
              <h4 class="slot-title">${escapeHtml(plan.name)}</h4>

          <div class="hiit-controls">
            <label class="input-wrap">
              <span class="input-label">Load / note</span>
              <input
                type="text"
                value="${escapeHtml(weightValue)}"

            </label>
            <label class="input-wrap">
              <span class="input-label">Rest (sec)</span>
              <input

            <div class="timer-row">
              <div>
                <div class="slot-kicker">${escapeHtml(phaseLabel)}</div>
                <div class="timer-display" id="hiitTimerDisplay">${formatSeconds(getHiitRemainingSeconds())}</div>
              </div>
              <div class="button-row">
                <button class="primary-button" type="button" data-action="hiit-start" ${timer.running ? "disabled" : ""}>${escapeHtml(startLabel)}</button>
                <button class="secondary-button" type="button" data-action="hiit-rest" ${timer.running || state.hiit.setsDone >= plan.targetSets ? "disabled" : ""}>Rest</button>

              </div>
            </div>

      return value
        .split(/[\n,]+/)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function hasCustomExerciseOverride(patternKey, subcategory) {
      return getCustomExerciseOptions(patternKey, subcategory).length > 0;
    }

      return formatExerciseListForEditor(getExerciseOptions(patternKey, subcategory));
    }

    function renderRecoveryGuidance(plan) {
      let sections = [];
      let summaryLabel = "Richtlijnen";

      if (plan.effectiveSessionType === "breatheRest") {
        sections = [
          { heading: "Today", items: ["Breathing.", "Rest.", "Optionally take an easy walk if that naturally feels good."] }
        ];
      } else if (plan.effectiveSessionType === "zone2") {
        sections = [
          { heading: "Zone 2", items: [plan.zone2Minutes + " minutes of easy cardio.", "Keep it at conversation pace.", "Do not eat into recovery."] }
        ];
      } else if (plan.effectiveSessionType === "hiit") {
        sections = [
          { heading: "HIIT", items: [plan.hiitSets + " sets.", "Quality over violence.", "Voelt de warming-up slecht, switch naar Breathe & Rest of Exploration."] }
        ];
      } else if (plan.effectiveSessionType === "recovery") {
        summaryLabel = "Recovery day";
        sections = [
          { heading: plan.recoveryDose.title, items: plan.recoveryDose.guidance }
        ];
      }

      const sectionsHtml = sections.map((section) => `
        <div class="mini-card" style="margin-top: 12px;">
          <h4>${escapeHtml(section.heading)}</h4>
          <ul class="detail-list">

          </ul>
        </div>

      return `
        <details class="accordion" style="margin-top: 16px;">
          <summary>${escapeHtml(summaryLabel)}</summary>
          <div class="accordion-body">
            ${sectionsHtml}
          </div>
        </details>
      `;
    }
