<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Session Compas</title>
  <style>
    :root {
      --bg: #f3f6f4;
      --bg-accent: #e8efea;
      --surface: rgba(255, 255, 255, 0.88);
      --surface-strong: #ffffff;
      --surface-soft: #f7faf8;
      --text: #18312a;
      --muted: #5f766e;
      --line: rgba(24, 49, 42, 0.12);
      --shadow: 0 18px 50px rgba(32, 65, 55, 0.10);
      --shadow-soft: 0 10px 28px rgba(32, 65, 55, 0.08);
      --primary: #406b5a;
      --primary-strong: #2f5446;
      --primary-soft: rgba(64, 107, 90, 0.12);
      --success: #3f8f65;
      --warning: #bf7e39;
      --danger: #b85c5c;
      --radius-xl: 28px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --radius-sm: 12px;
      --max-width: 860px;
      --transition: 180ms ease;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(100, 144, 126, 0.16), transparent 32%),
        radial-gradient(circle at bottom right, rgba(191, 126, 57, 0.08), transparent 28%),
        linear-gradient(180deg, #f8fbf9 0%, var(--bg) 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(130deg, rgba(255,255,255,0.18), transparent 35%),
        repeating-linear-gradient(
          135deg,
          rgba(64, 107, 90, 0.02) 0,
          rgba(64, 107, 90, 0.02) 10px,
          transparent 10px,
          transparent 22px
        );
      opacity: 0.7;
    }

    .app-shell {
      position: relative;
      width: min(calc(100% - 28px), var(--max-width));
      margin: 24px auto 42px;
      z-index: 1;
    }

    .hero {
      background: linear-gradient(145deg, rgba(255,255,255,0.95), rgba(245,250,247,0.84));
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 34px;
      box-shadow: var(--shadow);
      padding: 24px;
      backdrop-filter: blur(18px);
      overflow: hidden;
      position: relative;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -40px -60px auto;
      width: 180px;
      height: 180px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(64, 107, 90, 0.16), transparent 70%);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(64, 107, 90, 0.10);
      color: var(--primary-strong);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 8px;
      font-size: clamp(1.9rem, 4vw, 3rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 0;
      max-width: 52ch;
      color: var(--muted);
      line-height: 1.6;
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(24, 49, 42, 0.08);
      font-size: 0.95rem;
      color: var(--text);
      box-shadow: 0 8px 24px rgba(41, 68, 58, 0.06);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 18px;
      padding: 6px;
      border-radius: 22px;
      background: rgba(255,255,255,0.62);
      border: 1px solid rgba(24, 49, 42, 0.08);
      box-shadow: var(--shadow-soft);
      backdrop-filter: blur(12px);
    }

    .tab-button {
      appearance: none;
      border: 0;
      border-radius: 16px;
      padding: 14px 16px;
      background: transparent;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition), color var(--transition), transform var(--transition);
    }

    .tab-button.active {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #fff;
      box-shadow: 0 14px 28px rgba(64, 107, 90, 0.22);
    }

    .tab-button:active,
    .primary-button:active,
    .secondary-button:active,
    .nudge-button:active {
      transform: translateY(1px) scale(0.99);
    }

    .view {
      display: none;
      margin-top: 18px;
      animation: fadeIn 240ms ease;
    }

    .view.active {
      display: block;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .stack {
      display: grid;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-soft);
      padding: 20px;
      backdrop-filter: blur(16px);
    }

    .card.soft {
      background: rgba(255, 255, 255, 0.70);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .card h2,
    .card h3,
    .card h4 {
      margin: 0;
      letter-spacing: -0.02em;
    }

    .subtle {
      color: var(--muted);
      line-height: 1.55;
    }

    .day-banner {
      display: grid;
      gap: 14px;
    }

    .day-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      padding: 9px 12px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary-strong);
      border: 1px solid rgba(64, 107, 90, 0.14);
    }

    .slot-grid {
      display: grid;
      gap: 14px;
    }

    .slot-card {
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(244,248,246,0.96));
      border: 1px solid rgba(24, 49, 42, 0.08);
      border-radius: 22px;
      padding: 16px;
      box-shadow: 0 12px 26px rgba(39, 66, 56, 0.07);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    .slot-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 30px rgba(39, 66, 56, 0.10);
      border-color: rgba(64, 107, 90, 0.16);
    }

    .slot-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .slot-kicker {
      margin: 0 0 6px;
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .slot-title {
      margin: 0;
      font-size: 1.1rem;
      line-height: 1.25;
    }

    .slot-chip {
      flex-shrink: 0;
      padding: 8px 10px;
      border-radius: 14px;
      background: var(--surface-soft);
      border: 1px solid var(--line);
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--primary-strong);
    }

    .exercise-name {
      margin: 3px 0 0;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text);
    }

    .nudge-line {
      margin: 10px 0 0;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(64, 107, 90, 0.08);
      color: var(--primary-strong);
      font-size: 0.92rem;
    }

    .slot-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      margin-top: 14px;
    }

    .input-wrap {
      display: grid;
      gap: 8px;
    }

    .input-label {
      font-size: 0.9rem;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="text"] {
      width: 100%;
      border: 1px solid rgba(24, 49, 42, 0.14);
      border-radius: 14px;
      padding: 14px 15px;
      font-size: 1rem;
      color: var(--text);
      background: rgba(255,255,255,0.94);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    input[type="text"]:focus {
      border-color: rgba(64, 107, 90, 0.48);
      box-shadow: 0 0 0 4px rgba(64, 107, 90, 0.10);
    }

    textarea {
      width: 100%;
      min-height: 112px;
      resize: vertical;
      border: 1px solid rgba(24, 49, 42, 0.14);
      border-radius: 14px;
      padding: 14px 15px;
      font: inherit;
      color: var(--text);
      background: rgba(255,255,255,0.94);
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    textarea:focus {
      border-color: rgba(64, 107, 90, 0.48);
      box-shadow: 0 0 0 4px rgba(64, 107, 90, 0.10);
    }

    .nudge-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nudge-button,
    .primary-button,
    .secondary-button,
    .ghost-button {
      appearance: none;
      border: 0;
      cursor: pointer;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition), color var(--transition), border-color var(--transition);
    }

    .nudge-button {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(24, 49, 42, 0.12);
      color: var(--text);
      font-size: 1.2rem;
      font-weight: 700;
      box-shadow: 0 10px 18px rgba(39, 66, 56, 0.07);
    }

    .nudge-button.active-up {
      background: rgba(63, 143, 101, 0.14);
      border-color: rgba(63, 143, 101, 0.35);
      color: var(--success);
    }

    .nudge-button.active-down {
      background: rgba(184, 92, 92, 0.14);
      border-color: rgba(184, 92, 92, 0.32);
      color: var(--danger);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .primary-button,
    .secondary-button,
    .ghost-button {
      min-height: 52px;
      border-radius: 18px;
      padding: 14px 18px;
      font-size: 1rem;
      font-weight: 700;
    }

    .primary-button {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #fff;
      box-shadow: 0 18px 26px rgba(64, 107, 90, 0.22);
    }

    .secondary-button {
      background: rgba(255,255,255,0.82);
      color: var(--text);
      border: 1px solid rgba(24, 49, 42, 0.12);
      box-shadow: 0 12px 20px rgba(39, 66, 56, 0.06);
    }

    .ghost-button {
      background: rgba(184, 92, 92, 0.12);
      color: var(--danger);
      border: 1px solid rgba(184, 92, 92, 0.18);
    }

    .today-empty {
      text-align: center;
      padding: 28px 20px;
    }

    .action-card {
      display: grid;
      gap: 14px;
      text-align: left;
    }

    .action-value {
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,248,247,0.94));
      border: 1px solid rgba(24, 49, 42, 0.08);
    }

    .switch {
      position: relative;
      width: 62px;
      height: 36px;
      flex-shrink: 0;
    }

    .switch input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      margin: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: rgba(24, 49, 42, 0.14);
      border-radius: 999px;
      transition: background var(--transition);
    }

    .slider::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 4px;
      width: 28px;
      height: 28px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 8px 16px rgba(20, 38, 32, 0.18);
      transition: transform var(--transition);
    }

    .switch input:checked + .slider {
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
    }

    .switch input:checked + .slider::before {
      transform: translateX(26px);
    }

    .stats-grid,
    .library-grid,
    .history-grid {
      display: grid;
      gap: 14px;
    }

    .stats-grid {
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
    }

    .library-grid {
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    }

    .stat-card,
    .mini-card {
      padding: 16px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255,255,255,0.98), rgba(245,249,247,0.94));
      border: 1px solid rgba(24, 49, 42, 0.08);
      box-shadow: 0 12px 24px rgba(39, 66, 56, 0.06);
    }

    .stat-label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.86rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 800;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .mini-card h4 {
      margin-bottom: 8px;
      font-size: 1.02rem;
    }

    .inline-list,
    .detail-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .inline-list li,
    .detail-list li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(24, 49, 42, 0.08);
      color: var(--muted);
    }

    .inline-list li:last-child,
    .detail-list li:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .detail-list strong {
      color: var(--text);
    }

    .history-item {
      padding: 16px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(247,250,248,0.92));
      border: 1px solid rgba(24, 49, 42, 0.08);
    }

    .history-item h4 {
      margin-bottom: 8px;
    }

    .history-meta {
      color: var(--muted);
      font-size: 0.92rem;
      margin-bottom: 10px;
    }

    .muted-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .accordion {
      overflow: hidden;
    }

    .accordion summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-weight: 800;
      font-size: 1rem;
    }

    .accordion summary::-webkit-details-marker {
      display: none;
    }

    .accordion summary::after {
      content: "+";
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: rgba(64, 107, 90, 0.10);
      color: var(--primary-strong);
      font-size: 1.15rem;
      flex-shrink: 0;
      transition: transform var(--transition), background var(--transition);
    }

    .accordion[open] summary::after {
      transform: rotate(45deg);
      background: rgba(64, 107, 90, 0.16);
    }

    .accordion-body {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(24, 49, 42, 0.08);
    }

    .timer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }

    .timer-display {
      font-size: clamp(2rem, 7vw, 3rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .confetti-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 50;
    }

    .confetti-piece {
      position: absolute;
      top: -12vh;
      width: 12px;
      height: 18px;
      border-radius: 4px;
      opacity: 0.96;
      animation: confettiFall linear forwards;
    }

    @keyframes confettiFall {
      0% {
        transform: translate3d(0, -10vh, 0) rotate(0deg);
      }
      100% {
        transform: translate3d(var(--drift), 110vh, 0) rotate(var(--spin));
        opacity: 0.9;
      }
    }

    @media (max-width: 720px) {
      .app-shell {
        width: min(calc(100% - 18px), var(--max-width));
        margin-top: 12px;
      }

      .hero,
      .card {
        border-radius: 26px;
        padding: 18px;
      }

      .slot-controls {
        grid-template-columns: 1fr;
      }

      .nudge-controls {
        justify-content: flex-end;
      }

      .toggle-row {
        align-items: flex-start;
      }

      .card-header,
      .slot-top {
        flex-direction: column;
      }

      .slot-chip {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="confetti-layer" id="confettiLayer" aria-hidden="true"></div>

  <main class="app-shell">
    <section class="hero">
      <div class="eyebrow">Session Compas</div>
      <h1>Rustige structuur, slimme rotatie, nul gedoe.</h1>
      <p>Deze app bewaart je voortgang lokaal in je browser en geeft per trainingsdag een vaste, consistente opbouw met afwisselende patronen, subcategorieen en oefeningen.</p>
      <div class="hero-meta">
        <div class="pill" id="heroDayPill">Dag 1</div>
        <div class="pill" id="heroModePill">Vrije keus uit</div>
        <div class="pill" id="heroProgressPill">0 trainingen afgerond</div>
      </div>
    </section>

    <nav class="tabs" aria-label="Navigatie">
      <button class="tab-button active" data-tab="today" type="button">Vandaag</button>
      <button class="tab-button" data-tab="options" type="button">Opties</button>
      <button class="tab-button" data-tab="custom" type="button">Eigen Oefeningen</button>
    </nav>

    <section class="view active" id="todayView"></section>
    <section class="view" id="optionsView"></section>
    <section class="view" id="customView"></section>
  </main>

  <script>
    const STORAGE_KEY = "training-generator-v1";
    const TABS = { TODAY: "today", OPTIONS: "options", CUSTOM: "custom" };
    const TRAINING_DAYS = [1, 3, 5];
    const DAY_CYCLE = {
      1: { type: "training", title: "Trainingsdag", subtitle: "Core, vier main patronen en een secundair slot." },
      2: { type: "recovery", title: "Zone 2 cardio", subtitle: "30 tot 45 minuten" },
      3: { type: "training", title: "Trainingsdag", subtitle: "Core, vier main patronen en een secundair slot." },
      4: { type: "recovery", title: "Rust / Active Mobility", subtitle: "Herstel, ademhaling en soepel bewegen." },
      5: { type: "training", title: "Trainingsdag", subtitle: "Core, vier main patronen en een secundair slot." },
      6: { type: "recovery", title: "HIIT", subtitle: "10 tot 20 minuten" },
      7: { type: "recovery", title: "Rust / Active Mobility", subtitle: "Herstel, wandelen of rustige mobility." }
    };

    const MAIN_ORDERS = [
      ["squat", "push", "pull", "hinge"],
      ["push", "pull", "hinge", "squat"],
      ["pull", "hinge", "squat", "push"],
      ["hinge", "squat", "push", "pull"]
    ];

    const PROGRAM = {
      core: {
        label: "Core",
        subcategories: [
          "Anti-extensie",
          "Anti-lateral bending",
          "Anti-rotatie",
          "Hip Flexion Stable Spine",
          "Rotatie"
        ],
        exercises: {
          "Anti-extensie": ["Cable Crunch", "Ab Wheel", "Deadbug"],
          "Anti-lateral bending": ["Suitcase Carry", "Side Plank"],
          "Anti-rotatie": ["Pallof Press", "Chop", "Lift"],
          "Hip Flexion Stable Spine": ["Leg Raise", "Knee Raise"],
          "Rotatie": ["Woodchopper", "Russian Twist"]
        }
      },
      squat: {
        label: "Squat",
        subcategories: [
          "Symmetrische squat",
          "Asymmetrische squat",
          "Single leg squat"
        ],
        exercises: {
          "Symmetrische squat": ["Front Squat", "Back Squat", "Leg Press"],
          "Asymmetrische squat": ["Lunge", "Bulgarian Split Squat", "Side Lunge"],
          "Single leg squat": ["Box Pistol", "Step Up", "Skater Squat"]
        }
      },
      hinge: {
        label: "Hinge",
        subcategories: [
          "Axial symmetrisch",
          "Anterior-posterior asymmetrisch",
          "Axial single leg",
          "Anterior-posterior symmetrisch",
          "Axial asymmetrisch",
          "Anterior-posterior single leg"
        ],
        exercises: {
          "Axial symmetrisch": ["Conventional Deadlift", "Romanian Deadlift", "Leg Curl"],
          "Anterior-posterior asymmetrisch": ["B-Stance Hip Thrust", "B-Stance Glute Bridge"],
          "Axial single leg": ["Single Leg Deadlift", "Single Leg Good Morning"],
          "Anterior-posterior symmetrisch": ["Hip Thrust", "Glute Bridge"],
          "Axial asymmetrisch": ["B-Stance Deadlift", "B-Stance Good Morning"],
          "Anterior-posterior single leg": ["Single Leg Hip Thrust", "Single Leg Glute Bridge"]
        }
      },
      push: {
        label: "Push",
        subcategories: ["Horizontal push", "Vertical push"],
        exercises: {
          "Horizontal push": ["Bankdrukken", "Dumbbell Chest Press", "Dips"],
          "Vertical push": ["Barbell Military Press", "Kettlebell Military Press", "Dumbbell Military Press"]
        }
      },
      pull: {
        label: "Pull",

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return createDefaultState();
        }
        const parsed = JSON.parse(raw);
        return mergeWithDefaults(parsed);
      } catch (error) {
        console.warn("Kon state niet laden, defaults worden gebruikt.", error);
        return createDefaultState();
      }
    }

    function mergeWithDefaults(saved) {
      const base = createDefaultState();
      const merged = {
        ...base,
        ...saved,
        settings: {
          ...base.settings,
          ...(saved.settings || {})
        },
        rotations: {
          ...base.rotations,
          ...(saved.rotations || {}),
          subcategories: {
            ...base.rotations.subcategories,
            ...((saved.rotations && saved.rotations.subcategories) || {})
          },
          exercises: {
            ...base.rotations.exercises,
            ...((saved.rotations && saved.rotations.exercises) || {})
          }
        },
        records: {
          ...base.records,
          ...(saved.records || {}),
          exercises: {
            ...base.records.exercises,
            ...((saved.records && saved.records.exercises) || {})
          }
        },
        customExercises: {
          ...base.customExercises,
          ...(saved.customExercises || {}),
          core: {
            ...base.customExercises.core,
            ...((saved.customExercises && saved.customExercises.core) || {})
          },
          squat: {
            ...base.customExercises.squat,
            ...((saved.customExercises && saved.customExercises.squat) || {})
          },
          hinge: {
            ...base.customExercises.hinge,
            ...((saved.customExercises && saved.customExercises.hinge) || {})
          },
          push: {
            ...base.customExercises.push,
            ...((saved.customExercises && saved.customExercises.push) || {})
          },
          pull: {
            ...base.customExercises.pull,
            ...((saved.customExercises && saved.customExercises.pull) || {})
          },
          secondary: Array.isArray(saved.customExercises && saved.customExercises.secondary)
            ? saved.customExercises.secondary
            : base.customExercises.secondary
        },
        timers: {
          ...base.timers,
          ...(saved.timers || {}),
          long: {
            ...base.timers.long,
            ...((saved.timers && saved.timers.long) || (saved.timer || {}))
          },
          short: {
            ...base.timers.short,
            ...((saved.timers && saved.timers.short) || {})
          }
        },
        history: Array.isArray(saved.history) ? saved.history : [],
        currentWorkout: saved.currentWorkout || null
      };
      if (!TRAINING_DAYS.includes(merged.currentDay)) {
        merged.currentWorkout = null;
      }
      return merged;
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    function dayLabel(day) {
      return "Dag " + day;

    function getDayConfig(day) {
      if (day === 6 && !state.settings.hiitAsDay) {
        return {
          type: "recovery",
          title: "Rust / Active Mobility",
          subtitle: "HIIT zit als korte finisher na trainingsdagen."
        };
      }
      return DAY_CYCLE[day] || DAY_CYCLE[1];
    }

    function isTrainingDay(day) {
      return TRAINING_DAYS.includes(day);
    }

    function getSubcategoryKey(patternKey, subcategory) {
      return patternKey + "::" + subcategory;
    }

    function getStandardExerciseOptions(patternKey, subcategory) {
      if (patternKey === "secondary") {
        return PROGRAM.secondary.exercises.slice();
      }
      return (PROGRAM[patternKey].exercises[subcategory] || []).slice();
    }

    function getCustomExerciseOptions(patternKey, subcategory) {
      if (patternKey === "secondary") {
        return Array.isArray(state.customExercises.secondary) ? state.customExercises.secondary : [];
      }
      const group = state.customExercises[patternKey] || {};
      return Array.isArray(group[subcategory]) ? group[subcategory] : [];
    }

    function getExerciseOptions(patternKey, subcategory) {
      const custom = getCustomExerciseOptions(patternKey, subcategory).filter(Boolean);
      if (custom.length) {
        return custom;
      }
      return getStandardExerciseOptions(patternKey, subcategory);
    }

    function getNextSubcategory(patternKey) {
      const pattern = PROGRAM[patternKey];
      const list = pattern.subcategories;
      const currentIndex = state.rotations.subcategories[patternKey] || 0;
      const subcategory = list[currentIndex % list.length];
      state.rotations.subcategories[patternKey] = currentIndex + 1;
      return subcategory;
    }

    function getNextExercise(patternKey, subcategory) {
      const options = getExerciseOptions(patternKey, subcategory);
      const key = getSubcategoryKey(patternKey, subcategory);
      const currentIndex = state.rotations.exercises[key] || 0;
      const exercise = options[currentIndex % options.length];
      state.rotations.exercises[key] = currentIndex + 1;
      return exercise;
    }

    function getNextSecondaryExercise() {
      const options = getExerciseOptions("secondary", "Secundair");
      const currentIndex = state.rotations.subcategories.secondary || 0;
      const exercise = options[currentIndex % options.length];
      state.rotations.subcategories.secondary = currentIndex + 1;
      return exercise;
    }

    function getExerciseRecord(exercise) {
      if (!state.records.exercises[exercise]) {
        state.records.exercises[exercise] = {
          lastValue: "",
          pendingNudge: null
        };
      }
      return state.records.exercises[exercise];
    }

    function buildPreviousText(lastValue, pendingNudge) {
      if (!lastValue) {
        return "";
      }
      if (pendingNudge === "up") {
        return "Vorige keer: " + lastValue + " — probeer iets zwaarder";
      }
      if (pendingNudge === "down") {
        return "Vorige keer: " + lastValue + " — probeer iets lichter";
      }
      return "Vorige keer: " + lastValue;
    }

    function createAutoSlot(id, slotType, patternKey, titleOverride) {
      const pattern = PROGRAM[patternKey];
      const subcategory = getNextSubcategory(patternKey);
      const exercise = getNextExercise(patternKey, subcategory);
      const record = getExerciseRecord(exercise);
      const previousText = buildPreviousText(record.lastValue, record.pendingNudge);
      const inputValue = record.lastValue || "";
      const slot = {
        id,
        slotType,
        patternKey,
        label: titleOverride || pattern.label,
        subcategory,
        exercise,
        previousText,
        inputValue,
        nudgeChoice: null
      };
      record.pendingNudge = null;
      return slot;
    }

    function createFreeChoiceSlot(id, slotType, patternKey, titleOverride) {
      const pattern = PROGRAM[patternKey];
      const subcategory = patternKey === "secondary" ? "Secundair" : getNextSubcategory(patternKey);
      return {
        id,
        slotType,
        patternKey,
        label: titleOverride || pattern.label,
        subcategory,
        exercise: null,
        previousText: "",
        inputValue: "",
        nudgeChoice: null
      };
    }

    function createSecondarySlot(id, freeChoiceMode) {
      if (freeChoiceMode) {
        return createFreeChoiceSlot(id, "secondary", "secondary", "Secundair");
      }
      const exercise = getNextSecondaryExercise();
      const record = getExerciseRecord(exercise);
      const slot = {
        id,
        slotType: "secondary",
        patternKey: "secondary",
        label: "Secundair",
        subcategory: "Secundair",
        exercise,
        previousText: buildPreviousText(record.lastValue, record.pendingNudge),
        inputValue: record.lastValue || "",
        nudgeChoice: null
      };
      record.pendingNudge = null;
      return slot;
    }

    function rotateMainOrder() {
      const order = MAIN_ORDERS[state.rotations.mainOrderIndex % MAIN_ORDERS.length];
      state.rotations.mainOrderIndex += 1;
      return order;
    }

    function ensureCurrentWorkout() {
      if (!isTrainingDay(state.currentDay)) {
        state.currentWorkout = null;
        return;
      }

      if (state.currentWorkout && state.currentWorkout.day === state.currentDay) {
        return;
      }

      const freeChoiceMode = !!state.settings.freeChoice;
      const mainOrder = rotateMainOrder();
      const slots = [];

      if (freeChoiceMode) {
        slots.push(createFreeChoiceSlot("core", "core", "core", "Core"));
      } else {
        slots.push(createAutoSlot("core", "core", "core", "Core"));
      }

      mainOrder.forEach((patternKey, index) => {
        const slotId = "main-" + index;
        if (freeChoiceMode) {
          slots.push(createFreeChoiceSlot(slotId, "main", patternKey));
        } else {
          slots.push(createAutoSlot(slotId, "main", patternKey));
        }
      });

      slots.push(createSecondarySlot("secondary", freeChoiceMode));

      state.currentWorkout = {
        id: "workout-" + Date.now(),
        day: state.currentDay,
        generatedAt: new Date().toISOString(),
        freeChoiceMode,
        order: mainOrder,
        slots
      };
      saveState();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatDateTime(value) {
      try {
        return new Date(value).toLocaleString("nl-NL", {
          dateStyle: "medium",
          timeStyle: "short"
        });
      } catch (error) {
        return value;
      }
    }

    function nextDayValue(day) {
      return day === 7 ? 1 : day + 1;
    }

    function getCurrentHiitOption() {
      const currentIndex = state.rotations.subcategories.hiit || 0;
      return HIIT_OPTIONS[currentIndex % HIIT_OPTIONS.length];
    }

    function getCurrentEmbeddedHiitOption() {
      const currentIndex = state.rotations.subcategories.hiit || 0;
      return HIIT_OPTIONS_HALVED[currentIndex % HIIT_OPTIONS_HALVED.length];
    }

    function advanceHiitRotation() {
      state.rotations.subcategories.hiit = (state.rotations.subcategories.hiit || 0) + 1;
    }

    function formatSeconds(totalSeconds) {
      const safeSeconds = Math.max(0, totalSeconds);
      const minutes = Math.floor(safeSeconds / 60);
      const seconds = safeSeconds % 60;
      return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
    }

    function getTimerState(timerKey) {
      return state.timers[timerKey];
    }

    function getRemainingSeconds(timerKey) {
      const timer = getTimerState(timerKey);
      if (!timer.running || !timer.endTime) {
        return timer.lastDurationSec || (timerKey === "short" ? 60 : 180);
      }
      const diffMs = timer.endTime - Date.now();
      return Math.max(0, Math.ceil(diffMs / 1000));
    }

    function syncTimerState() {
      ["long", "short"].forEach((timerKey) => {
        const timer = getTimerState(timerKey);
        if (!timer.running || !timer.endTime) {
          return;
        }
        if (Date.now() >= timer.endTime && !timer.beeped) {
          timer.beeped = true;
          timer.running = false;
          saveState();
          playBeep(timerKey === "short" ? 1046 : 880);
        }
      });
    }

    function startRestTimer(timerKey, durationSec) {
      const timer = getTimerState(timerKey);
      timer.lastDurationSec = durationSec;
      timer.endTime = Date.now() + (durationSec * 1000);
      timer.running = true;
      timer.beeped = false;
      saveState();
      startTimerLoop();
      renderApp();
    }

    function stopRestTimer(timerKey) {
      const timer = getTimerState(timerKey);
      timer.running = false;
      timer.endTime = null;
      timer.beeped = false;
      timer.lastDurationSec = timerKey === "short" ? 60 : 180;
      saveState();
      renderApp();
    }

    function startTimerLoop() {
      if (timerIntervalId) {
        return;
      }
      timerIntervalId = window.setInterval(() => {
        syncTimerState();
        updateTimerDisplay();
      }, 250);
    }

    function updateTimerDisplay() {
      ["long", "short"].forEach((timerKey) => {
        const display = document.getElementById("timerDisplay-" + timerKey);
        if (display) {
          display.textContent = formatSeconds(getRemainingSeconds(timerKey));
        }
      });
      const anyRunning = ["long", "short"].some((timerKey) => getTimerState(timerKey).running);
      if (!anyRunning && timerIntervalId) {
        window.clearInterval(timerIntervalId);
        timerIntervalId = null;
      }
    }

    function playBeep(frequency) {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) {
          return;
        }
        const context = new AudioContextClass();
        const oscillator = context.createOscillator();
        const gain = context.createGain();
        oscillator.type = "sine";
        oscillator.frequency.value = frequency || 880;
        gain.gain.setValueAtTime(0.001, context.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.18, context.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.55);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start();
        oscillator.stop(context.currentTime + 0.55);
      } catch (error) {
        console.warn("Beep kon niet worden afgespeeld.", error);
      }
    }

    function renderSlot(slot, freeChoiceMode) {
      const nudgeMarkup = !freeChoiceMode && slot.previousText
        ? `<div class="nudge-line">${escapeHtml(slot.previousText)}</div>`
        : "";
      const exerciseMarkup = freeChoiceMode
        ? ""
        : `<p class="exercise-name">${escapeHtml(slot.exercise)}</p>`;
      const controlsMarkup = freeChoiceMode
        ? ""
        : `
          <div class="slot-controls">
            <label class="input-wrap">
              <span class="input-label">Gewicht / notitie</span>
              <input
                type="text"
                value="${escapeHtml(slot.inputValue || "")}"
                placeholder="Bijv. 24 kg of 2x8"
                data-action="slot-input"
                data-slot-id="${escapeHtml(slot.id)}"
              >
            </label>
            <div class="nudge-controls">
              <button class="nudge-button ${slot.nudgeChoice === "down" ? "active-down" : ""}" type="button" data-action="nudge" data-slot-id="${escapeHtml(slot.id)}" data-direction="down" aria-label="Volgende keer iets lichter">-</button>
              <button class="nudge-button ${slot.nudgeChoice === "up" ? "active-up" : ""}" type="button" data-action="nudge" data-slot-id="${escapeHtml(slot.id)}" data-direction="up" aria-label="Volgende keer iets zwaarder">+</button>
            </div>
          </div>
        `;

      return `
        <article class="slot-card">
          <div class="slot-top">
            <div>
              <p class="slot-kicker">${escapeHtml(slot.label)}</p>
              <h4 class="slot-title">${escapeHtml(slot.subcategory)}</h4>
              ${exerciseMarkup}
            </div>
            <div class="slot-chip">${escapeHtml(slot.slotType === "main" ? "Main" : slot.label)}</div>
          </div>
          ${nudgeMarkup}
          ${controlsMarkup}
        </article>
      `;
    }

    function parseExerciseEditorValue(value) {
      return value
        .split(/[\n,]+/)
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function hasCustomExerciseOverride(patternKey, subcategory) {
      return getCustomExerciseOptions(patternKey, subcategory).length > 0;
    }

    function getEditorValue(patternKey, subcategory) {
      return formatExerciseListForEditor(getExerciseOptions(patternKey, subcategory));
    }

    function renderRecoveryGuidance(day) {
      const content = RECOVERY_CONTENT[day];
      if (!content) {
        return "";
      }

      const sectionsHtml = content.sections.map((section) => `
        <div class="mini-card" style="margin-top: 12px;">
          <h4>${escapeHtml(section.heading)}</h4>
          <ul class="detail-list">
            ${section.items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}
          </ul>
        </div>
      `).join("");

      return `
        <details class="accordion" style="margin-top: 16px;">
          <summary>${escapeHtml(content.title)}</summary>
          <div class="accordion-body">
            ${sectionsHtml}
          </div>
        </details>
      `;
    }

    function renderTimerCard() {
      const longTimer = getTimerState("long");
      const shortTimer = getTimerState("short");
      const statusText = (longTimer.running || shortTimer.running)
        ? "De timers lopen op echte tijd en blijven daardoor correct, ook als deze pagina even niet vooraan staat."
        : "Gebruik 3:00 voor normale rust en 1:00 voor samen trainen of supersets.";

      return `
        <article class="card soft">
          <div class="card-header">
            <div>
              <h3>Rusttimers</h3>
              <p class="subtle">${statusText}</p>
            </div>
            <div class="slot-chip">${longTimer.running || shortTimer.running ? "Actief" : "Klaar"}</div>
          </div>
          <div class="stats-grid">
            <div class="mini-card">
              <div class="timer-row">
                <div>
                  <div class="slot-kicker">Normale rust</div>
                  <div class="timer-display" id="timerDisplay-long">${formatSeconds(getRemainingSeconds("long"))}</div>
                </div>
                <div class="button-row">
                  <button class="primary-button" type="button" id="startTimerButton-long">${longTimer.running ? "Herstart 3:00" : "Start 3:00"}</button>
                  <button class="secondary-button" type="button" id="stopTimerButton-long">Stop</button>
                </div>
              </div>
            </div>
            <div class="mini-card">
              <div class="timer-row">
                <div>
                  <div class="slot-kicker">Superset / samen</div>
                  <div class="timer-display" id="timerDisplay-short">${formatSeconds(getRemainingSeconds("short"))}</div>
                </div>
                <div class="button-row">
                  <button class="primary-button" type="button" id="startTimerButton-short">${shortTimer.running ? "Herstart 1:00" : "Start 1:00"}</button>
                  <button class="secondary-button" type="button" id="stopTimerButton-short">Stop</button>
                </div>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function bindWorkoutControls() {
      bindTimerControls();

      document.querySelectorAll('[data-action="slot-input"]').forEach((input) => {
        input.addEventListener("input", (event) => {
          const slotId = event.target.getAttribute("data-slot-id");
          const slot = findWorkoutSlot(slotId);
          if (!slot) {
            return;
          }
          slot.inputValue = event.target.value;
          saveState();
        });
      });

      document.querySelectorAll('[data-action="nudge"]').forEach((button) => {
        button.addEventListener("click", () => {
          const slotId = button.getAttribute("data-slot-id");
          const direction = button.getAttribute("data-direction");
          const slot = findWorkoutSlot(slotId);
          if (!slot) {
            return;
          }
          slot.nudgeChoice = slot.nudgeChoice === direction ? null : direction;
          saveState();
          renderToday();
        });
      });

      const finishButton = document.getElementById("finishWorkoutButton");
      if (finishButton) {
        finishButton.addEventListener("click", handleFinishWorkout);
      }
    }

    function bindTimerControls() {
      const startLongButton = document.getElementById("startTimerButton-long");
      if (startLongButton) {
        startLongButton.addEventListener("click", () => startRestTimer("long", 180));
      }

      const stopLongButton = document.getElementById("stopTimerButton-long");
      if (stopLongButton) {
        stopLongButton.addEventListener("click", () => stopRestTimer("long"));
      }

      const startShortButton = document.getElementById("startTimerButton-short");
      if (startShortButton) {
        startShortButton.addEventListener("click", () => startRestTimer("short", 60));
      }

      const stopShortButton = document.getElementById("stopTimerButton-short");
      if (stopShortButton) {
        stopShortButton.addEventListener("click", () => stopRestTimer("short"));
      }
    }

    function findWorkoutSlot(slotId) {
      if (!state.currentWorkout) {
        return null;
      }
      return state.currentWorkout.slots.find((slot) => slot.id === slotId) || null;
    }

    function handleFinishWorkout() {
      if (!state.currentWorkout) {
        return;
      }

      const workout = state.currentWorkout;
      workout.slots.forEach((slot) => {
        if (!workout.freeChoiceMode && slot.exercise) {
          const record = getExerciseRecord(slot.exercise);
          if (slot.inputValue && slot.inputValue.trim()) {
            record.lastValue = slot.inputValue.trim();
          }
          record.pendingNudge = slot.nudgeChoice || null;
        }
      });

      state.history.unshift({
        id: "history-" + Date.now(),
        type: "training",
        day: state.currentDay,
        title: "Training afgerond",
        completedAt: new Date().toISOString(),
        freeChoiceMode: workout.freeChoiceMode,
        hiitFinisher: state.settings.hiitAsDay ? null : getCurrentEmbeddedHiitOption(),
        slots: workout.slots.map((slot) => ({
          label: slot.label,
          subcategory: slot.subcategory,
          exercise: slot.exercise,
          value: slot.inputValue || ""
        }))
      });

      if (!state.settings.hiitAsDay) {
        advanceHiitRotation();
      }
      state.trainingSessionsCompleted += 1;
      state.totalDayAdvances += 1;
      state.currentDay = nextDayValue(state.currentDay);
      state.currentWorkout = null;
      saveState();
      launchConfetti();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function handleSkipDay() {
      const config = getDayConfig(state.currentDay);
      if (state.currentDay === 6 && state.settings.hiitAsDay) {
        advanceHiitRotation();
      }
      state.history.unshift({
        id: "history-" + Date.now(),
        type: "skip",
        day: state.currentDay,
        title: config.title,
        completedAt: new Date().toISOString(),
        freeChoiceMode: false,
        slots: []
      });

      state.totalDayAdvances += 1;
      state.currentDay = nextDayValue(state.currentDay);
      state.currentWorkout = null;
      saveState();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function handleFinishRecoveryDay() {
      const config = getDayConfig(state.currentDay);
      if (state.currentDay === 6 && state.settings.hiitAsDay) {
        advanceHiitRotation();
      }
      state.history.unshift({
        id: "history-" + Date.now(),
        type: "recovery-finish",
        day: state.currentDay,
        title: config.title,
        completedAt: new Date().toISOString(),
        freeChoiceMode: false,
        slots: []
      });

      state.totalDayAdvances += 1;
      state.currentDay = nextDayValue(state.currentDay);
      state.currentWorkout = null;
      saveState();
      launchConfetti();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function renderOptions() {
      const view = document.getElementById("optionsView");
      const nextOrder = MAIN_ORDERS[state.rotations.mainOrderIndex % MAIN_ORDERS.length]
        .map((patternKey) => PROGRAM[patternKey].label)
        .join(" → ");

      const rotationCards = ["core", "squat", "push", "pull", "hinge"].map((patternKey) => {
        const pattern = PROGRAM[patternKey];
        const nextSubcategory = pattern.subcategories[state.rotations.subcategories[patternKey] % pattern.subcategories.length];
        const nextExercise = state.settings.freeChoice
          ? "Verborgen in vrije keus"
          : previewNextExercise(patternKey, nextSubcategory);

        return `
          <div class="mini-card">
            <h4>${escapeHtml(pattern.label)}</h4>
            <ul class="detail-list">
              <li><strong>Volgende subcategorie:</strong> ${escapeHtml(nextSubcategory)}</li>
              <li><strong>Volgende oefening:</strong> ${escapeHtml(nextExercise)}</li>
            </ul>
          </div>
        `;
      }).join("");

      const libraryCards = ["core", "squat", "push", "pull", "hinge"].map((patternKey) => {
        const pattern = PROGRAM[patternKey];
        const subList = pattern.subcategories.map((subcategory) => {
          const exercises = (pattern.exercises[subcategory] || []).join(", ");
          return `<li><strong>${escapeHtml(subcategory)}:</strong> ${escapeHtml(exercises)}</li>`;
        }).join("");
        return `
          <div class="mini-card">
            <h4>${escapeHtml(pattern.label)}</h4>
            <ul class="detail-list">${subList}</ul>
          </div>
        `;
      }).join("");

      const secondaryCard = `
        <div class="mini-card">
          <h4>Secundair</h4>
          <ul class="detail-list">
            ${PROGRAM.secondary.exercises.map((exercise) => `<li>${escapeHtml(exercise)}</li>`).join("")}
          </ul>
        </div>
      `;

      const historyItems = state.history.length
        ? state.history.slice(0, 12).map((item) => {
            const summary = item.type === "training"
              ? item.slots.map((slot) => {
                  const line = [slot.label, slot.subcategory, slot.exercise].filter(Boolean).join(" — ");
                  return slot.value ? line + " (" + slot.value + ")" : line;
                }).concat(item.hiitFinisher ? ["HIIT finisher - " + item.hiitFinisher] : []).join(" | ")
              : item.type === "recovery-finish"
                ? "Dag afgerond en doorgezet naar de volgende dag."
                : "Dag overgeslagen en doorgezet naar de volgende dag.";
            return `
              <article class="history-item">
                <h4>${escapeHtml(dayLabel(item.day))} · ${escapeHtml(item.title)}</h4>
                <div class="history-meta">${escapeHtml(formatDateTime(item.completedAt))}${item.type === "training" ? " · " + (item.freeChoiceMode ? "Vrije keus" : "Automatisch") : ""}</div>
                <div class="subtle">${escapeHtml(summary)}</div>
              </article>
            `;
          }).join("")
        : `
          <article class="history-item">
            <h4>Nog geen historie</h4>
            <div class="subtle">Zodra je dagen afrondt of overslaat, verschijnt hier een eenvoudig logboek.</div>
          </article>
        `;

      const pendingModeNote = state.currentWorkout && state.currentWorkout.freeChoiceMode !== state.settings.freeChoice
        ? `<p class="muted-note">De huidige trainingssessie is al gegenereerd. De nieuwe stand van Vrije keus geldt volledig vanaf de volgende trainingsdag.</p>`
        : "";

      view.innerHTML = `
        <div class="stack">
          <article class="card">
            <div class="card-header">
              <div>
                <h2>Opties</h2>
                <p class="subtle">Instellingen, rotatiestatus, oefeningsoverzicht en historie.</p>
              </div>
            </div>
            <div class="toggle-row">
              <div>
                <h3>Vrije keus</h3>
                <p class="subtle">Aan: alleen patroon en subcategorie tonen. Uit: automatisch een oefening kiezen per slot.</p>
                ${pendingModeNote}
              </div>
              <label class="switch" aria-label="Vrije keus aan of uit">
                <input type="checkbox" id="freeChoiceToggle" ${state.settings.freeChoice ? "checked" : ""}>
                <span class="slider"></span>
              </label>
            </div>
            <div class="toggle-row" style="margin-top: 14px;">
              <div>
                <h3>HIIT dag</h3>
                <p class="subtle">Aan: dag 6 blijft een losse HIIT-dag. Uit: HIIT wordt gehalveerd en komt na trainingsdagen, na Secundair.</p>
              </div>
              <label class="switch" aria-label="HIIT dag aan of uit">
                <input type="checkbox" id="hiitAsDayToggle" ${state.settings.hiitAsDay ? "checked" : ""}>
                <span class="slider"></span>
              </label>
            </div>
            <div class="button-row">
              <button class="ghost-button" type="button" id="resetButton">Reset alles</button>
            </div>
          </article>

          <article class="card">
            <div class="card-header">
              <div>
                <h3>Status</h3>
                <p class="subtle">De huidige dag en welke rotaties hierna klaarstaan.</p>
              </div>
            </div>
            <div class="stats-grid">
              <div class="stat-card">
                <span class="stat-label">Huidige dag</span>
                <div class="stat-value">${escapeHtml(dayLabel(state.currentDay))}</div>
              </div>
              <div class="stat-card">
                <span class="stat-label">Dagtype</span>
                <div class="stat-value">${escapeHtml(getDayConfig(state.currentDay).title)}</div>
              </div>
              <div class="stat-card">
                <span class="stat-label">Volgende main-volgorde</span>
                <div class="stat-value">${escapeHtml(nextOrder)}</div>
              </div>
              <div class="stat-card">
                <span class="stat-label">Trainingen afgerond</span>
                <div class="stat-value">${state.trainingSessionsCompleted}</div>
              </div>
              <div class="stat-card">
                <span class="stat-label">HIIT modus</span>
                <div class="stat-value">${escapeHtml(state.settings.hiitAsDay ? "Losse HIIT-dag" : "Finisher na training")}</div>
              </div>
            </div>
          </article>

          <article class="card">
            <div class="card-header">
              <div>
                <h3>Rotatie-status</h3>
                <p class="subtle">Per patroon zie je welke subcategorie en oefening als volgende klaarstaan.</p>
              </div>
            </div>
            <div class="library-grid">
              ${rotationCards}
              <div class="mini-card">
                <h4>Secundair</h4>
                <ul class="detail-list">
                  <li><strong>Volgende oefening:</strong> ${escapeHtml(state.settings.freeChoice ? "Verborgen in vrije keus" : previewNextSecondaryExercise())}</li>
                </ul>
              </div>
            </div>
          </article>

          <article class="card">
            <div class="card-header">
              <div>
                <h3>Oefeningsoverzicht</h3>
                <p class="subtle">Alle hoofdpatronen, subcategorieen en oefeningen op een plek.</p>
              </div>
            </div>
            <div class="library-grid">
              ${libraryCards}
              ${secondaryCard}
            </div>
          </article>

          <article class="card">
            <div class="card-header">
              <div>
                <h3>Historie</h3>
                <p class="subtle">Recente afgeronde of overgeslagen dagen.</p>
              </div>
            </div>
            <div class="history-grid">
              ${historyItems}
            </div>
          </article>
        </div>
      `;

      document.getElementById("freeChoiceToggle").addEventListener("change", (event) => {
        state.settings.freeChoice = event.target.checked;
        saveState();
        renderApp();
        switchTab(TABS.OPTIONS);
      });

      document.getElementById("hiitAsDayToggle").addEventListener("change", (event) => {
        state.settings.hiitAsDay = event.target.checked;
        saveState();
        renderApp();
        switchTab(TABS.OPTIONS);
      });

      document.getElementById("resetButton").addEventListener("click", handleReset);
    }

    function renderCustomExercises() {
      const view = document.getElementById("customView");
      const patternKeys = ["core", "squat", "push", "pull", "hinge"];
      const cards = patternKeys.map((patternKey) => {
        const pattern = PROGRAM[patternKey];
        const blocks = pattern.subcategories.map((subcategory) => {
          const standardList = getStandardExerciseOptions(patternKey, subcategory);
          const hasOverride = hasCustomExerciseOverride(patternKey, subcategory);
          return `
            <div class="mini-card">
              <h4>${escapeHtml(subcategory)}</h4>
              <p class="subtle">${hasOverride ? "Eigen lijst actief." : "Standaardlijst actief."} Je kunt hieronder losse oefeningen aanpassen of alles vervangen.</p>
              <label class="input-wrap">
                <span class="input-label">Eigen oefeningen</span>
                <textarea data-action="custom-exercises" data-pattern="${escapeHtml(patternKey)}" data-subcategory="${escapeHtml(subcategory)}" placeholder="Typ oefeningen gescheiden door komma's of nieuwe regels">${escapeHtml(getEditorValue(patternKey, subcategory))}</textarea>
              </label>
              <div class="button-row">
                <button class="secondary-button" type="button" data-action="reset-custom-subcategory" data-pattern="${escapeHtml(patternKey)}" data-subcategory="${escapeHtml(subcategory)}">Herstel standaard</button>
              </div>
            </div>
          `;
        }).join("");

        return `
          <article class="card">
            <div class="card-header">
              <div>
                <h3>${escapeHtml(pattern.label)}</h3>
                <p class="subtle">Zodra je hier iets invult, gebruikt de generator jouw lijst in plaats van de standaardlijst.</p>
              </div>
            </div>
            <div class="library-grid">${blocks}</div>
          </article>
        `;
      }).join("");

      const secondaryCard = `
        <article class="card">
          <div class="card-header">
            <div>
              <h3>Secundair</h3>
              <p class="subtle">Deze lijst overschrijft de standaard secundaire rotatie.</p>
            </div>
          </div>
          <div class="mini-card">
            <p class="subtle">${hasCustomExerciseOverride("secondary", "Secundair") ? "Eigen lijst actief." : "Standaardlijst actief."} Je kunt hieronder losse oefeningen aanpassen of alles vervangen.</p>
            <label class="input-wrap">
              <span class="input-label">Eigen oefeningen</span>
              <textarea data-action="custom-exercises" data-pattern="secondary" data-subcategory="Secundair" placeholder="Typ oefeningen gescheiden door komma's of nieuwe regels">${escapeHtml(getEditorValue("secondary", "Secundair"))}</textarea>
            </label>
            <div class="button-row">
              <button class="secondary-button" type="button" data-action="reset-custom-subcategory" data-pattern="secondary" data-subcategory="Secundair">Herstel standaard</button>
            </div>
          </div>
        </article>
      `;

      view.innerHTML = `
        <div class="stack">
          <article class="card">
            <div class="card-header">
              <div>
                <h2>Eigen Oefeningen</h2>
                <p class="subtle">Vul per subcategorie je eigen oefeningen in. Laat een vak leeg om de standaardlijst te blijven gebruiken.</p>
              </div>
            </div>
            <div class="button-row">
              <button class="ghost-button" type="button" id="resetAllCustomButton">Reset alle eigen oefeningen</button>
            </div>
          </article>
          ${cards}
          ${secondaryCard}
        </div>
      `;

      bindCustomExerciseControls();
    }

    function bindCustomExerciseControls() {
      document.querySelectorAll('[data-action="custom-exercises"]').forEach((textarea) => {
        textarea.addEventListener("input", (event) => {
          const patternKey = event.target.getAttribute("data-pattern");
          const subcategory = event.target.getAttribute("data-subcategory");
          const parsed = parseExerciseEditorValue(event.target.value);

          if (patternKey === "secondary") {
            state.customExercises.secondary = parsed;
          } else {
            state.customExercises[patternKey] = state.customExercises[patternKey] || {};
            state.customExercises[patternKey][subcategory] = parsed;
          }

          saveState();
        });
      });

      document.querySelectorAll('[data-action="reset-custom-subcategory"]').forEach((button) => {
        button.addEventListener("click", () => {
          const patternKey = button.getAttribute("data-pattern");
          const subcategory = button.getAttribute("data-subcategory");

          if (patternKey === "secondary") {
            state.customExercises.secondary = [];
          } else if (state.customExercises[patternKey]) {
            delete state.customExercises[patternKey][subcategory];
          }

          saveState();
          renderApp();
          switchTab(TABS.CUSTOM);
        });
      });

      const resetAllButton = document.getElementById("resetAllCustomButton");
      if (resetAllButton) {
        resetAllButton.addEventListener("click", () => {
          const confirmed = window.confirm("Weet je zeker dat je alle eigen oefeningen wilt verwijderen en terug wilt naar de standaardlijsten?");
          if (!confirmed) {
            return;
          }
          state.customExercises = createDefaultCustomExercises();
          saveState();
          renderApp();
          switchTab(TABS.CUSTOM);
        });
      }
    }

    function previewNextExercise(patternKey, subcategory) {
      const options = getExerciseOptions(patternKey, subcategory);
      const key = getSubcategoryKey(patternKey, subcategory);
      const currentIndex = state.rotations.exercises[key] || 0;
      return options[currentIndex % options.length];
    }

    function previewNextSecondaryExercise() {
      const options = getExerciseOptions("secondary", "Secundair");
      const currentIndex = state.rotations.subcategories.secondary || 0;
      return options[currentIndex % options.length];
    }

    function handleReset() {
      const confirmed = window.confirm("Weet je zeker dat je alle voortgang, gewichten, nudges, rotaties en historie wilt resetten?");
      if (!confirmed) {
        return;
      }
      state = createDefaultState();
      saveState();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function updateHero() {
      document.getElementById("heroDayPill").textContent = dayLabel(state.currentDay) + " · " + getDayConfig(state.currentDay).title;
      document.getElementById("heroModePill").textContent = "Vrije keus " + (state.settings.freeChoice ? "aan" : "uit");
      document.getElementById("heroProgressPill").textContent = state.trainingSessionsCompleted + " trainingen afgerond";
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle("active", button.getAttribute("data-tab") === tabName);
      });
      document.querySelectorAll(".view").forEach((view) => {
        const targetId = tabName === TABS.TODAY
          ? "todayView"
          : tabName === TABS.OPTIONS
            ? "optionsView"
            : "customView";
        view.classList.toggle("active", view.id === targetId);
      });
    }

    function renderApp() {
      syncTimerState();
      updateHero();
      renderToday();
      renderOptions();
      renderCustomExercises();
      switchTab(activeTab || TABS.TODAY);
      updateTimerDisplay();
    }

    function launchConfetti() {
      const layer = document.getElementById("confettiLayer");
      layer.innerHTML = "";
      const colors = ["#406b5a", "#6fa18e", "#f1bf79", "#d68181", "#ffffff"];

      for (let index = 0; index < 70; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[index % colors.length];
        piece.style.animationDuration = 2200 + Math.random() * 1800 + "ms";
        piece.style.animationDelay = Math.random() * 120 + "ms";
        piece.style.setProperty("--drift", (Math.random() * 38 - 19).toFixed(2) + "vw");
        piece.style.setProperty("--spin", Math.round(Math.random() * 800 - 400) + "deg");
        layer.appendChild(piece);
      }

      window.setTimeout(() => {
        layer.innerHTML = "";
      }, 4200);
    }

    document.querySelectorAll(".tab-button").forEach((button) => {
      button.addEventListener("click", () => {
        switchTab(button.getAttribute("data-tab"));
      });
    });

    document.addEventListener("visibilitychange", () => {
      syncTimerState();
      updateTimerDisplay();
    });

    renderApp();
    switchTab(TABS.TODAY);
    startTimerLoop();
  </script>
</body>
</html>
