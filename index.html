    function bindWorkoutControls() {
      bindTimerControls();

      document.querySelectorAll('[data-action="slot-input"]').forEach((input) => {
        input.addEventListener("input", (event) => {
          const slotId = event.target.getAttribute("data-slot-id");
          const slot = findWorkoutSlot(slotId);
          if (!slot) {
            return;
          }
          slot.inputValue = event.target.value;
          saveState();
        });
      });

      document.querySelectorAll('[data-action="nudge"]').forEach((button) => {
        button.addEventListener("click", () => {
          const slotId = button.getAttribute("data-slot-id");
          const direction = button.getAttribute("data-direction");
          const slot = findWorkoutSlot(slotId);
          if (!slot) {
            return;
          }
          slot.nudgeChoice = slot.nudgeChoice === direction ? null : direction;
          saveState();
          renderToday();
        });
      });

      const finishButton = document.getElementById("finishWorkoutButton");
      if (finishButton) {
        finishButton.addEventListener("click", handleFinishWorkout);
      }
    }

    function bindRecoveryGateControls() {
      document.querySelectorAll('[data-action="recovery-slider"]').forEach((input) => {
        input.addEventListener("input", (event) => {
          const key = event.target.getAttribute("data-key");
          const value = Number(event.target.value);
          const draft = {
            ...createDefaultRecoveryCheckin(),
            ...(getTodayRecoveryCheckin() || {})
          };
          draft[key] = value;
          state.recoveryCheckins[getTodayKey()] = draft;
          const label = document.getElementById("recoveryValue-" + key);
          if (label) {
            label.textContent = value;
          }
          const total = getRecoveryTotal(draft);
          const band = getRecoveryBand(total);
          const totalLabel = document.getElementById("recoveryTotalValue");
          const bandLabel = document.getElementById("recoveryBandValue");
          if (totalLabel) {
            totalLabel.textContent = total + "/15";
          }
          if (bandLabel) {
            bandLabel.textContent = band.label;
          }
          saveState();
        });
      });

      const startButton = document.getElementById("startSessionButton");
      if (startButton) {
        startButton.addEventListener("click", () => {
          const draft = {
            ...createDefaultRecoveryCheckin(),
            ...(getTodayRecoveryCheckin() || {})
          };
          draft.submittedAt = new Date().toISOString();
          state.recoveryCheckins[getTodayKey()] = draft;
          saveState();
          renderApp();
          switchTab(TABS.TODAY);
        });
      }
    }

    function bindTimerControls() {
      document.querySelectorAll('[data-action="group-timer-start"]').forEach((button) => {
        button.addEventListener("click", () => {
          startRestTimer(button.getAttribute("data-timer-key"), Number(button.getAttribute("data-duration")));
        });
      });

      document.querySelectorAll('[data-action="group-timer-stop"]').forEach((button) => {
        button.addEventListener("click", () => stopRestTimer(button.getAttribute("data-timer-key")));
      });

      const hiitWeightInput = document.querySelector('[data-action="hiit-weight"]');
      if (hiitWeightInput) {
        hiitWeightInput.addEventListener("input", (event) => updateHiitWeight(event.target.value));
      }

      const hiitRestDurationInput = document.querySelector('[data-action="hiit-rest-duration"]');
      if (hiitRestDurationInput) {
        hiitRestDurationInput.addEventListener("change", (event) => updateHiitRestDuration(event.target.value));
      }

      const hiitStartButton = document.querySelector('[data-action="hiit-start"]');
      if (hiitStartButton) {
        hiitStartButton.addEventListener("click", () => startHiitPhase("work"));
      }

      const hiitRestButton = document.querySelector('[data-action="hiit-rest"]');
      if (hiitRestButton) {
        hiitRestButton.addEventListener("click", () => startHiitPhase("rest"));
      }

      const hiitStopButton = document.querySelector('[data-action="hiit-stop"]');
      if (hiitStopButton) {
        hiitStopButton.addEventListener("click", stopHiitTimer);
      }

      const hiitResetButton = document.querySelector('[data-action="hiit-reset"]');
      if (hiitResetButton) {
        hiitResetButton.addEventListener("click", resetHiitSets);
      }
    }

    function findWorkoutSlot(slotId) {
      if (!state.currentWorkout) {
        return null;
      }
      return state.currentWorkout.slots.find((slot) => slot.id === slotId) || null;
    }

    function handleEditRecoveryCheckin() {
      const todayKey = getTodayKey();
      const current = state.recoveryCheckins[todayKey];
      if (!current) {
        renderApp();
        return;
      }
      state.recoveryCheckins[todayKey] = {
        ...current,
        submittedAt: null
      };
      saveState();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function handleFinishWorkout() {
      if (!state.currentWorkout) {
        return;
      }

      const todayPlan = getTodayPlan();
      const workout = state.currentWorkout;
      workout.slots.forEach((slot) => {
        if (!workout.freeChoiceMode && slot.exercise) {
          const record = getExerciseRecord(slot.exercise);
          if (slot.inputValue && slot.inputValue.trim()) {
            record.lastValue = slot.inputValue.trim();
          }
          record.pendingNudge = slot.nudgeChoice || null;
        }
      });

      state.history.unshift({
        id: "history-" + Date.now(),
        type: "training",
        sessionType: "strength",
        title: todayPlan.strengthDose ? todayPlan.strengthDose.title : "Strength",
        completedAt: new Date().toISOString(),
        recoveryBand: todayPlan.band ? todayPlan.band.label : "",
        recoveryTotal: todayPlan.total || null,
        freeChoiceMode: workout.freeChoiceMode,
        slots: workout.slots.map((slot) => ({
          label: slot.label,
          subcategory: slot.subcategory,
          exercise: slot.exercise,
          value: slot.inputValue || ""
        }))
      });

      state.trainingSessionsCompleted += 1;
      state.currentWorkout = null;
      saveState();
      launchConfetti();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function handleSkipDay() {
      const todayPlan = getTodayPlan();
      state.history.unshift({
        id: "history-" + Date.now(),
        type: "skip",
        sessionType: todayPlan.effectiveSessionType || todayPlan.baseSessionType,
        title: todayPlan.title || "Session skipped",
        completedAt: new Date().toISOString(),
        recoveryBand: todayPlan.band ? todayPlan.band.label : "",
        recoveryTotal: todayPlan.total || null,
        freeChoiceMode: false,
        slots: []
      });

      state.currentWorkout = null;
      saveState();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function handleFinishRecoveryDay() {
      const todayPlan = getTodayPlan();
      const hiitPlan = todayPlan.effectiveSessionType === "hiit" ? getCurrentHiitPlan() : null;
      if (hiitPlan) {
        advanceHiitRotation();
      }
      state.history.unshift({
        id: "history-" + Date.now(),
        type: "recovery-finish",
        sessionType: todayPlan.effectiveSessionType,
        title: todayPlan.title,
        completedAt: new Date().toISOString(),
        recoveryBand: todayPlan.band ? todayPlan.band.label : "",
        recoveryTotal: todayPlan.total || null,
        freeChoiceMode: false,
        hiitFinisher: hiitPlan ? formatHiitPlan(hiitPlan) : null,
        hiitWeight: hiitPlan ? (state.hiit.weights[getHiitSessionKey(hiitPlan)] || "") : "",
        hiitSetsDone: hiitPlan ? (state.hiit.setsDone || 0) : 0,
        slots: []
      });

      state.currentWorkout = null;
      saveState();
      launchConfetti();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function renderOptions() {
      const view = document.getElementById("optionsView");
      const nextOrder = MAIN_ORDERS[state.rotations.mainOrderIndex % MAIN_ORDERS.length]
        .map((patternKey) => PROGRAM[patternKey].label)
        .join(" -> ");

      const rotationCards = ["core", "squat", "push", "pull", "hinge"].map((patternKey) => {
        const pattern = PROGRAM[patternKey];
        const nextSubcategory = pattern.subcategories[state.rotations.subcategories[patternKey] % pattern.subcategories.length];
        const nextExercise = state.settings.freeChoice
          ? "Hidden in free choice"
          : previewNextExercise(patternKey, nextSubcategory);

        return `
          <div class="mini-card">
            <h4>${escapeHtml(pattern.label)}</h4>
            <ul class="detail-list">
              <li><strong>Next subcategory:</strong> ${escapeHtml(nextSubcategory)}</li>
              <li><strong>Next exercise:</strong> ${escapeHtml(nextExercise)}</li>
            </ul>
          </div>
        `;
      }).join("");

      const libraryCards = ["core", "squat", "push", "pull", "hinge"].map((patternKey) => {
        const pattern = PROGRAM[patternKey];
        const subList = pattern.subcategories.map((subcategory) => {
          const exercises = (pattern.exercises[subcategory] || []).join(", ");
          return `<li><strong>${escapeHtml(subcategory)}:</strong> ${escapeHtml(exercises)}</li>`;
        }).join("");
        return `
          <div class="mini-card">
            <h4>${escapeHtml(pattern.label)}</h4>
            <ul class="detail-list">${subList}</ul>
          </div>
        `;
      }).join("");

      const secondaryCard = `
        <div class="mini-card">
          <h4>Secondary</h4>
          <ul class="detail-list">
            ${PROGRAM.secondary.exercises.map((exercise) => `<li>${escapeHtml(exercise)}</li>`).join("")}
          </ul>
        </div>
      `;

      const historyItems = state.history.length
        ? state.history.slice(0, 12).map((item) => {
            const summary = item.type === "training"
              ? item.slots.map((slot) => {
                  const line = [slot.label, slot.subcategory, slot.exercise].filter(Boolean).join(" -- ");
                  return slot.value ? line + " (" + slot.value + ")" : line;
                }).join(" | ")
              : item.type === "recovery-finish"
                ? (item.hiitFinisher ? item.hiitFinisher : "Session completed according to recovery guidance.")
                : "Session skipped.";
            return `
              <article class="history-item">
                <h4>${escapeHtml(item.title)}</h4>
                <div class="day-badges">
                  ${item.sessionType ? `<div class="badge">${escapeHtml(SESSION_LABELS[item.sessionType] || item.sessionType)}</div>` : ""}
                  ${item.recoveryTotal ? `<div class="badge">${escapeHtml(item.recoveryTotal + "/15")}</div>` : ""}
                  ${item.type === "training" ? `<div class="badge">${item.freeChoiceMode ? "Free choice" : "Automatic"}</div>` : ""}
                </div>
                <div class="history-meta">${escapeHtml(formatDateTime(item.completedAt))}${item.sessionType ? " - " + escapeHtml(SESSION_LABELS[item.sessionType] || item.sessionType) : ""}${item.recoveryTotal ? " - " + escapeHtml(item.recoveryTotal + "/15") : ""}${item.type === "training" ? " - " + (item.freeChoiceMode ? "Free choice" : "Automatic") : ""}</div>
                <div class="history-summary">${escapeHtml(summary)}</div>
              </article>
            `;
          }).join("")
        : `
          <article class="history-item">
            <h4>No history yet</h4>
            <div class="subtle">Once you complete or skip sessions, a simple logbook will appear here.</div>
          </article>
        `;

      const pendingModeNote = state.currentWorkout && state.currentWorkout.freeChoiceMode !== state.settings.freeChoice
        ? `<p class="muted-note">The current strength session has already been generated. The new Free choice setting will fully apply once you rebuild that session.</p>`
        : "";
      const trainingStyleCards = Object.values(TRAINING_STYLE_OPTIONS).map((option) => `
        <label class="mini-card">
          <div style="display: flex; align-items: flex-start; gap: 10px;">
            <input type="radio" name="trainingStyle" value="${escapeHtml(option.key)}" ${state.settings.trainingStyle === option.key ? "checked" : ""}>
            <div>
              <h4>${escapeHtml(option.label)}</h4>
              <p class="subtle">${escapeHtml(option.summary)}</p>
            </div>
          </div>
        </label>
      `).join("");

      view.innerHTML = `
        <div class="stack">
          <article class="card">
            <div class="card-header">
              <div>
                <h2>Options</h2>
                <p class="subtle">Settings, exercise overview, and history.</p>
              </div>
            </div>
            <div class="toggle-row">
              <div>
                <h3>Free choice</h3>
                <p class="subtle">On: show only the pattern and subcategory. Off: automatically choose an exercise for each slot.</p>
                ${pendingModeNote}
              </div>
              <label class="switch" aria-label="Free choice on or off">
                <input type="checkbox" id="freeChoiceToggle" ${state.settings.freeChoice ? "checked" : ""}>
                <span class="slider"></span>
              </label>
            </div>
            <div class="mini-card" style="margin-top: 14px;">
              <h3>Training style</h3>
              <p class="subtle">Choose the guideline shown during strength sessions.</p>
              <div class="library-grid" style="margin-top: 12px;">
                ${trainingStyleCards}
              </div>
            </div>
            <div class="mini-card" style="margin-top: 14px;">
              <h3>Compass logic</h3>
              <p class="subtle">The logbook chooses the session type. After 3 training sessions in a row, Compass forces a recovery day. The recovery gate chooses the dose. Exercise rotation chooses the content.</p>
            </div>
            <div class="mini-card" style="margin-top: 14px;">
              <h3>Next main rotation</h3>
              <p class="subtle">${escapeHtml(nextOrder)}</p>
            </div>
            <div class="button-row">
              <button class="ghost-button" type="button" id="resetButton">Reset all</button>
            </div>
          </article>

          <article class="card">
            <div class="card-header">
              <div>
                <h3>Exercise rotation</h3>
                <p class="subtle">The structure stays the same; Compass only rotates through content and subcategories.</p>
              </div>
            </div>
            <div class="library-grid">
              ${rotationCards}
            </div>
          </article>

          <article class="card">
            <div class="card-header">
              <div>
                <h3>Exercise overview</h3>
                <p class="subtle">All main patterns, subcategories, and exercises in one place.</p>
              </div>
            </div>
            <div class="library-grid">
              ${libraryCards}
              ${secondaryCard}
            </div>
          </article>

          <article class="card">
            <div class="card-header">
              <div>
                <h3>History</h3>
                <p class="subtle">Recent completed or skipped sessions.</p>
              </div>
            </div>
            <div class="history-grid">
              ${historyItems}
            </div>
          </article>
        </div>
      `;

      document.getElementById("freeChoiceToggle").addEventListener("change", (event) => {
        state.settings.freeChoice = event.target.checked;
        saveState();
        renderApp();
        switchTab(TABS.OPTIONS);
      });

      document.querySelectorAll('input[name="trainingStyle"]').forEach((input) => {
        input.addEventListener("change", (event) => {
          state.settings.trainingStyle = event.target.value;
          saveState();
          renderApp();
          switchTab(TABS.OPTIONS);
        });
      });

      document.getElementById("resetButton").addEventListener("click", handleReset);
    }

    function renderCustomExercises() {
      const view = document.getElementById("customView");
      const patternKeys = ["core", "squat", "push", "pull", "hinge"];
      const cards = patternKeys.map((patternKey) => {
        const pattern = PROGRAM[patternKey];
        const blocks = pattern.subcategories.map((subcategory) => {
          const standardList = getStandardExerciseOptions(patternKey, subcategory);
          const hasOverride = hasCustomExerciseOverride(patternKey, subcategory);
          return `
            <div class="mini-card">
              <h4>${escapeHtml(subcategory)}</h4>
              <p class="subtle">${hasOverride ? "Custom list active." : "Default list active."} You can edit individual exercises below or replace everything.</p>
              <label class="input-wrap">
                <span class="input-label">Custom exercises</span>
                <textarea data-action="custom-exercises" data-pattern="${escapeHtml(patternKey)}" data-subcategory="${escapeHtml(subcategory)}" placeholder="Type exercises separated by commas or new lines">${escapeHtml(getEditorValue(patternKey, subcategory))}</textarea>
              </label>
              <div class="button-row">
                <button class="secondary-button" type="button" data-action="reset-custom-subcategory" data-pattern="${escapeHtml(patternKey)}" data-subcategory="${escapeHtml(subcategory)}">Restore default</button>
              </div>
            </div>
          `;
        }).join("");

        return `
          <article class="card">
            <div class="card-header">
              <div>
                <h3>${escapeHtml(pattern.label)}</h3>
                <p class="subtle">As soon as you add something here, the generator will use your list instead of the default list.</p>
              </div>
            </div>
            <div class="library-grid">${blocks}</div>
          </article>
        `;
      }).join("");

      const secondaryCard = `
        <article class="card">
          <div class="card-header">
            <div>
              <h3>Secondary</h3>
              <p class="subtle">This list overrides the default secondary rotation.</p>
            </div>
          </div>
          <div class="mini-card">
            <p class="subtle">${hasCustomExerciseOverride("secondary", "Secondary") ? "Custom list active." : "Default list active."} You can edit individual exercises below or replace everything.</p>
            <label class="input-wrap">
              <span class="input-label">Custom exercises</span>
              <textarea data-action="custom-exercises" data-pattern="secondary" data-subcategory="Secondary" placeholder="Type exercises separated by commas or new lines">${escapeHtml(getEditorValue("secondary", "Secondary"))}</textarea>
            </label>
            <div class="button-row">
              <button class="secondary-button" type="button" data-action="reset-custom-subcategory" data-pattern="secondary" data-subcategory="Secondary">Restore default</button>
            </div>
          </div>
        </article>
      `;

      view.innerHTML = `
        <div class="stack">
          <article class="card">
            <div class="card-header">
              <div>
                <h2>Custom Exercises</h2>
                <p class="subtle">Enter your own exercises for each subcategory. Leave a field empty to keep using the default list. Then use save & reset to rebuild the current training day immediately.</p>
              </div>
            </div>
            <div class="button-row">
              <button class="primary-button" type="button" id="saveResetCustomButton">Save &amp; reset current day</button>
              <button class="ghost-button" type="button" id="resetAllCustomButton">Reset all custom exercises</button>
            </div>
          </article>
          ${cards}
          ${secondaryCard}
        </div>
      `;

      bindCustomExerciseControls();
    }

    function bindCustomExerciseControls() {
      document.querySelectorAll('[data-action="custom-exercises"]').forEach((textarea) => {
        textarea.addEventListener("input", (event) => {
          const patternKey = event.target.getAttribute("data-pattern");
          const subcategory = event.target.getAttribute("data-subcategory");
          const parsed = parseExerciseEditorValue(event.target.value);

          if (patternKey === "secondary") {
            state.customExercises.secondary = parsed;
          } else {
            state.customExercises[patternKey] = state.customExercises[patternKey] || {};
            state.customExercises[patternKey][subcategory] = parsed;
          }

          saveState();
        });
      });

      const saveResetButton = document.getElementById("saveResetCustomButton");
      if (saveResetButton) {
        saveResetButton.addEventListener("click", () => {
          saveState();
          resetCurrentWorkoutWithLatestExercises();
          renderApp();
          switchTab(TABS.TODAY);
        });
      }

      document.querySelectorAll('[data-action="reset-custom-subcategory"]').forEach((button) => {
        button.addEventListener("click", () => {
          const patternKey = button.getAttribute("data-pattern");
          const subcategory = button.getAttribute("data-subcategory");

          if (patternKey === "secondary") {
            state.customExercises.secondary = [];
          } else if (state.customExercises[patternKey]) {
            delete state.customExercises[patternKey][subcategory];
          }

          saveState();
          renderApp();
          switchTab(TABS.CUSTOM);
        });
      });

      const resetAllButton = document.getElementById("resetAllCustomButton");
      if (resetAllButton) {
        resetAllButton.addEventListener("click", () => {
          const confirmed = window.confirm("Are you sure you want to remove all custom exercises and return to the default lists?");
          if (!confirmed) {
            return;
          }
          state.customExercises = createDefaultCustomExercises();
          saveState();
          renderApp();
          switchTab(TABS.CUSTOM);
        });
      }
    }

    function previewNextExercise(patternKey, subcategory) {
      const options = getExerciseOptions(patternKey, subcategory);
      const key = getSubcategoryKey(patternKey, subcategory);
      const currentIndex = state.rotations.exercises[key] || 0;
      return options[currentIndex % options.length];
    }

    function previewNextSecondaryExercise() {
      const options = getExerciseOptions("secondary", "Secondary");
      const currentIndex = state.rotations.subcategories.secondary || 0;
      return options[currentIndex % options.length];
    }

    function handleReset() {
      const confirmed = window.confirm("Are you sure you want to reset all progress, loads, nudges, rotations, and history?");
      if (!confirmed) {
        return;
      }
      state = createDefaultState();
      saveState();
      renderApp();
      switchTab(TABS.TODAY);
    }

    function updateHero() {
      if (isTodayClosed()) {
        document.getElementById("heroDayPill").textContent = "Finished - Today";
        document.getElementById("heroModePill").textContent = "Free choice " + (state.settings.freeChoice ? "on" : "off");
        document.getElementById("heroProgressPill").textContent = state.trainingSessionsCompleted + " sessions completed";
        return;
      }

      const plan = getTodayPlan();
      const heroLabel = plan.pendingCheckin
        ? "Recovery start"
        : (SESSION_LABELS[plan.effectiveSessionType] || plan.title);
      const heroDetail = plan.pendingCheckin
        ? (SESSION_LABELS[plan.baseSessionType] || "Session")
        : (plan.band.label + " - " + plan.total + "/15");
      document.getElementById("heroDayPill").textContent = heroLabel + " - " + heroDetail;
      document.getElementById("heroModePill").textContent = "Free choice " + (state.settings.freeChoice ? "on" : "off");
      document.getElementById("heroProgressPill").textContent = state.trainingSessionsCompleted + " sessions completed";
    }

    function switchTab(tabName) {
      activeTab = tabName;
      document.querySelectorAll(".tab-button").forEach((button) => {
        button.classList.toggle("active", button.getAttribute("data-tab") === tabName);
      });
      document.querySelectorAll(".view").forEach((view) => {
        const targetId = tabName === TABS.TODAY
          ? "todayView"
          : tabName === TABS.OPTIONS
            ? "optionsView"
            : "customView";
        view.classList.toggle("active", view.id === targetId);
      });
    }

    function renderApp() {
      syncTimerState();
      updateHero();
      renderToday();
      renderOptions();
      renderCustomExercises();
      switchTab(activeTab || TABS.TODAY);
      updateTimerDisplay();
    }

    function launchConfetti() {
      const layer = document.getElementById("confettiLayer");
      layer.innerHTML = "";
      const colors = ["#406b5a", "#6fa18e", "#f1bf79", "#d68181", "#ffffff"];

      for (let index = 0; index < 70; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[index % colors.length];
        piece.style.animationDuration = 2200 + Math.random() * 1800 + "ms";
        piece.style.animationDelay = Math.random() * 120 + "ms";
        piece.style.setProperty("--drift", (Math.random() * 38 - 19).toFixed(2) + "vw");
        piece.style.setProperty("--spin", Math.round(Math.random() * 800 - 400) + "deg");
        layer.appendChild(piece);
      }

      window.setTimeout(() => {
        layer.innerHTML = "";
      }, 4200);
    }

    document.querySelectorAll(".tab-button").forEach((button) => {
      button.addEventListener("click", () => {
        switchTab(button.getAttribute("data-tab"));
      });
    });

    document.addEventListener("visibilitychange", () => {
      syncTimerState();
      updateTimerDisplay();
      updateWakeLock();
    });

    renderApp();
    switchTab(TABS.TODAY);
    startTimerLoop();
  </script>
</body>
</html>
